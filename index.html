*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  /* ── MatchRank: ESPN/Sorare dark ── */
  --bg:#0a0a0f;              /* deep space black */
  --bg2:#0f0f16;
  --card:#16161f;            /* elevated surface */
  --surf:#1c1c28;
  --surf2:#22222f;
  --cal:#ffffff;
  --white:#ffffff;
  --off-white:#e8e8f0;
  --muted:#9898b0;
  --dim:#55556a;
  --bdr:#1e1e2e;
  --bdr2:#28283c;
  --bdr3:#363650;

  /* Accents */
  --reflector:#4f8ef7;       /* ESPN blue */
  --reflector2:#7aabff;
  --gold:#f7c948;            /* trophy gold */
  --gold2:#ffd96e;
  --green:#00e676;
  --green2:#00ff8c;
  --red:#ff3b5c;
  --red2:#cc2244;
  --brasa:#ff3b5c;
  --brasa2:#cc2244;
  --txt:#ffffff;

  /* Gradients */
  --grad-hero:linear-gradient(135deg,#0a0a0f 0%,#0d0d1e 50%,#0a0a0f 100%);
  --grad-card:linear-gradient(160deg,#16161f,#1c1c28);
  --grad-accent:linear-gradient(135deg,#4f8ef7,#7b5cf7);
  --grad-gold:linear-gradient(135deg,#f7c948,#ffd96e);

}

html,body{
  height:100%;background:var(--noche);color:var(--white);
  font-family:'Barlow',sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;
}

/* ── App container: el túnel del estadio ── */
#app{
  height:100dvh;max-width:480px;margin:0 auto;
  display:flex;flex-direction:column;position:relative;
  background:var(--noche);
  /* Capas de luz estática — haces de reflector que cruzan el escenario */
  background-image:
    /* haz ámbar desde arriba izquierda (reflector principal) */
    radial-gradient(ellipse 90% 55% at 18% -10%, rgba(244,198,107,0.18), transparent 55%),
    /* haz frío desde arriba derecha */
    radial-gradient(ellipse 70% 45% at 82% -5%, rgba(180,220,255,0.09), transparent 55%),
    /* niebla baja verdosa (césped iluminado desde lejos) */
    radial-gradient(ellipse 120% 50% at 50% 100%, rgba(40,90,65,0.28), transparent 60%),
    /* pozo de luz central sobre el logo/contenido */
    radial-gradient(ellipse 60% 35% at 50% 22%, rgba(244,198,107,0.08), transparent 70%);
  background-attachment: local;
}

/* Viñeta cinematográfica fija sobre todo, sin interceptar clics */
#app::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:50;
  background:
    radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,0.55) 100%),
    linear-gradient(180deg, rgba(0,0,0,0.35) 0%, transparent 18%, transparent 75%, rgba(0,0,0,0.55) 100%);
}
/* Haz lateral "salida del túnel" — apenas perceptible pero cambia la sensación */
#app::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:49;
  background:
    linear-gradient(90deg, rgba(244,198,107,0.05) 0%, transparent 8%, transparent 92%, rgba(244,198,107,0.05) 100%);
  mix-blend-mode:screen;
}

/* Grano de película — un SVG de ruido inline, súper liviano (~400 bytes). Repeat evita descargas extra. */
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:200;opacity:0.05;
  background-image:url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHdpZHRoPScxNjAnIGhlaWdodD0nMTYwJz48ZmlsdGVyIGlkPSduJz48ZmVUdXJidWxlbmNlIHR5cGU9J2ZyYWN0YWxOb2lzZScgYmFzZUZyZXF1ZW5jeT0nMC45JyBudW1PY3RhdmVzPScyJyBzZWVkPSczJy8+PGZlQ29sb3JNYXRyaXggdmFsdWVzPScwIDAgMCAwIDAuOTMgMCAwIDAgMCAwLjk1IDAgMCAwIDAgMC44OCAwIDAgMCAwLjYgMCcvPjwvZmlsdGVyPjxyZWN0IHdpZHRoPScxMDAlJyBoZWlnaHQ9JzEwMCUnIGZpbHRlcj0ndXJsKCNuKScvPjwvc3ZnPg==");
  mix-blend-mode:overlay;
}

/* Línea de cal — detalle fino que aparece en la parte superior como el borde del campo */
#app > .screen::before{
  content:'';position:absolute;left:0;right:0;top:0;height:1px;
  background:linear-gradient(90deg, transparent, rgba(238,242,234,0.18) 20%, rgba(238,242,234,0.35) 50%, rgba(238,242,234,0.18) 80%, transparent);
  pointer-events:none;z-index:1;
}

/* ── Screen ── */
.screen{flex:1;overflow-y:auto;padding-bottom:110px;background:transparent;position:relative;z-index:2}

/* ── Typography — bigger, with more air ── */
h1,h2{font-family:'Bebas Neue',sans-serif;letter-spacing:3px;color:var(--white)}
h3,h4{font-family:'Barlow Condensed',sans-serif;font-weight:900;letter-spacing:1px}

/* Etiquetas pequeñas tipo "megafonía del estadio" */
.kicker{
  font-family:'Barlow Condensed',sans-serif;font-weight:900;
  font-size:10px;letter-spacing:4px;color:var(--reflector);
  text-transform:uppercase;
  display:inline-flex;align-items:center;gap:8px;
}
.kicker::before{content:'';width:20px;height:1px;background:var(--reflector);opacity:.7}

/* ── Buttons ── */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  padding:15px 20px;border-radius:4px;
  font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:15px;
  letter-spacing:3px;cursor:pointer;border:none;width:100%;
  transition:opacity .15s,transform .1s,box-shadow .2s;
  text-transform:uppercase;
  position:relative;
}
.btn:active{opacity:.9;transform:translateY(1px)}
.btn-gold{
  background:linear-gradient(135deg,#4f8ef7 0%,#7b5cf7 100%);
  color:#ffffff;
  border:none;
  box-shadow:0 0 20px rgba(79,142,247,0.35),0 4px 15px rgba(0,0,0,0.4);
  font-family:'Barlow Condensed',sans-serif;font-weight:900;letter-spacing:2px;
  border-radius:12px;padding:14px 20px;cursor:pointer;width:100%;
  transition:box-shadow .2s,transform .1s;
}
.btn-gold:active{transform:scale(.97)}
.btn-gold:hover{box-shadow:0 1px 0 rgba(255,255,255,0.5) inset,0 -2px 0 rgba(120,75,15,0.35) inset,0 14px 36px rgba(79,142,247,0.35),0 2px 6px rgba(0,0,0,0.5)}
.btn-out{background:transparent;border:1.5px solid rgba(244,198,107,0.55);color:var(--reflector2);letter-spacing:3px}
.btn-out:hover{background:rgba(79,142,247,0.08);border-color:var(--reflector)}
.btn-red{background:rgba(255,74,46,.08);border:1.5px solid rgba(255,74,46,0.4);color:var(--brasa)}
.btn-dim{background:rgba(238,242,234,0.03);color:var(--muted);border:1px solid var(--bdr2)}
.btn-blue{background:linear-gradient(135deg,#101916,#162220);color:var(--white);border:1px solid var(--bdr3)}

/* ── Inputs ── */
.inp{
  width:100%;padding:15px 16px;
  background:rgba(6,10,9,0.75);
  border:1px solid var(--bdr2);border-radius:4px;
  color:var(--white);font-size:15px;font-family:'Barlow',sans-serif;
  outline:none;transition:border-color .2s,box-shadow .2s,background .2s;
  box-sizing:border-box;
  box-shadow:0 1px 0 rgba(255,255,255,0.03) inset, 0 2px 8px rgba(0,0,0,0.3) inset;
}
.inp:focus{border-color:var(--reflector);box-shadow:0 0 0 3px rgba(79,142,247,0.15),0 1px 0 rgba(255,255,255,0.04) inset}
.inp::placeholder{color:var(--dim);letter-spacing:.5px}
.lbl{
  font-family:'Barlow Condensed',sans-serif;font-weight:900;
  font-size:10px;letter-spacing:4px;color:var(--reflector);
  margin-bottom:9px;display:block;text-transform:uppercase
}

/* ── Navigation — barra del pasillo del estadio ── */
.nav{
  position:fixed;bottom:0;left:0;right:0;
  background:linear-gradient(180deg, rgba(10,15,13,0.88), rgba(4,7,6,0.98));
  border-top:1px solid rgba(244,198,107,0.18);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  display:flex;z-index:100;
  padding-bottom:env(safe-area-inset-bottom,8px);
  box-shadow:0 -12px 40px rgba(0,0,0,0.7), 0 -1px 0 rgba(244,198,107,0.08) inset;
}
.ni{
  flex:1;display:flex;flex-direction:column;align-items:center;
  padding:11px 4px 9px;position:relative;cursor:pointer;
  border:none;background:none;color:var(--dim);
  font-size:8px;font-weight:900;letter-spacing:1.8px;gap:4px;
  font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;
  transition:color .2s
}
.ni.on{color:var(--reflector)}
.ni.on::before{
  content:'';position:absolute;top:0;left:20%;right:20%;height:2px;
  background:linear-gradient(90deg, transparent, var(--reflector), transparent);
  box-shadow:0 0 10px var(--reflector);
}
.ni.on .ni-ico{filter:drop-shadow(0 0 10px rgba(244,198,107,0.55))}
.ni-ico{font-size:22px;line-height:1}

/* ── Back button ── */
.bk{
  background:none;border:none;cursor:pointer;
  color:var(--reflector);font-weight:900;font-size:13px;
  padding:8px 0;display:flex;align-items:center;gap:6px;
  font-family:'Barlow Condensed',sans-serif;letter-spacing:2px;text-transform:uppercase
}
.bk:hover{color:var(--reflector2)}

/* ── Cards — superficies con profundidad real, como palcos del estadio ── */
.card{background:var(--card);border:1px solid var(--bdr2);border-radius:14px;padding:14px}
.card-gold{
  background:
    linear-gradient(180deg, rgba(79,142,247,0.08), transparent 40%),
    linear-gradient(145deg, #0d1613, #121d18);
  border:1px solid rgba(244,198,107,0.28);
  border-top-color:rgba(244,198,107,0.45);
  box-shadow:
    0 0 0 1px rgba(244,198,107,0.05) inset,
    0 20px 50px rgba(0,0,0,0.55),
    0 0 30px rgba(244,198,107,0.08);
}
.card-stat{background:rgba(238,242,234,0.03);border:1px solid var(--bdr);border-radius:4px;padding:9px 12px;text-align:center}

/* ── Player Card — retrato iluminado por los focos ── */
.fifa-card{
  background:
    radial-gradient(ellipse 80% 50% at 50% -10%, rgba(244,198,107,0.18), transparent 60%),
    linear-gradient(170deg, #0e1814 0%, #0a1512 50%, #050907 100%);
  border:1px solid rgba(244,198,107,0.25);
  border-top-color:rgba(244,198,107,0.45);
  border-radius:6px;
  box-shadow:
    0 1px 0 rgba(255,255,255,0.05) inset,
    0 12px 28px rgba(0,0,0,0.55),
    0 0 18px rgba(79,142,247,0.08);
  position:relative;overflow:hidden;
  padding:12px 8px 12px;
  text-align:center;cursor:pointer;
  transition:transform .15s,box-shadow .15s
}
.fifa-card:hover{transform:translateY(-2px);box-shadow:0 1px 0 rgba(255,255,255,0.08) inset,0 18px 38px rgba(0,0,0,0.6),0 0 30px rgba(244,198,107,0.16)}
.fifa-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--reflector),transparent);
  opacity:.7;
}
.fifa-card::after{
  /* barrido de luz diagonal estático, como el reflejo en una medalla */
  content:'';position:absolute;top:-20%;left:-30%;width:60%;height:140%;
  background:linear-gradient(110deg, transparent 35%, rgba(255,255,255,0.06) 50%, transparent 65%);
  pointer-events:none;transform:rotate(12deg);
}
.fifa-card-rating{
  font-family:'Bebas Neue',sans-serif;font-size:30px;color:var(--reflector);
  line-height:1;text-shadow:0 0 18px rgba(79,142,247,0.35);
  letter-spacing:1px;
}
.fifa-card-pos{
  font-family:'Barlow Condensed',sans-serif;font-weight:900;
  font-size:9px;letter-spacing:3px;color:var(--muted);text-transform:uppercase
}
.fifa-card-photo{
  width:62px;height:62px;border-radius:50%;
  border:2px solid rgba(244,198,107,0.35);
  background:linear-gradient(135deg,rgba(244,198,107,0.14),transparent);
  overflow:hidden;margin:6px auto;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 0 3px rgba(0,0,0,0.4), 0 6px 14px rgba(0,0,0,0.5);
}
.fifa-card-name{
  font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:2px;
  color:var(--white);margin-top:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}

/* ── Badges ── */
.badge{
  display:inline-flex;align-items:center;
  padding:4px 10px;border-radius:3px;
  font-family:'Barlow Condensed',sans-serif;font-weight:900;
  font-size:10px;letter-spacing:2.5px;text-transform:uppercase
}
.badge-gold{background:rgba(79,142,247,0.1);color:var(--reflector);border:1px solid rgba(244,198,107,0.32)}
.badge-green{background:rgba(91,224,163,0.09);color:var(--esmeralda);border:1px solid rgba(91,224,163,0.28)}
.badge-red{background:rgba(255,74,46,0.08);color:var(--brasa);border:1px solid rgba(255,74,46,0.28)}
.badge-blue{background:rgba(238,242,234,0.05);color:var(--muted);border:1px solid var(--bdr2)}
.badge-dim{background:rgba(80,90,85,0.12);color:var(--dim);border:1px solid rgba(80,90,85,0.22)}

/* ── Section title — megafonía del estadio ── */
.sec-title{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:10px;letter-spacing:3px;color:var(--reflector);text-transform:uppercase;margin-bottom:10px}
.sec-title::before{content:'';width:18px;height:2px;background:var(--reflector);box-shadow:0 0 8px var(--reflector)}
.sec-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(79,142,247,0.25),transparent)}

/* ── Divider ── */
.divider{height:1px;background:linear-gradient(90deg,transparent,var(--bdr2),transparent);margin:16px 0}

/* ── Rating badge ── */
.rating-badge{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  width:52px;height:62px;
  background:linear-gradient(160deg,#1a0000,#080000);
  border:1.5px solid rgba(255,32,32,0.4);border-radius:8px;
  box-shadow:0 2px 16px rgba(255,32,32,0.2)
}
.rating-num{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--red);line-height:1}
.rating-pos{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:9px;letter-spacing:2px;color:var(--muted);text-transform:uppercase}

/* ── Spinner ── */
.sp{display:inline-block;width:28px;height:28px;border:3px solid var(--bdr2);border-top-color:var(--red);border-radius:50%;animation:spin .8s linear infinite}

/* ── Animations ── */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes pop{from{opacity:0;transform:scale(.25) rotate(-15deg)}to{opacity:1;transform:scale(1) rotate(0)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.up{animation:up .3s ease forwards}
.pop{animation:pop .45s cubic-bezier(.175,.885,.32,1.275) forwards}

/* ── Scrollbar ── */
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bdr3);border-radius:3px}

/* ── Table ── */
table{width:100%;border-collapse:collapse}
th{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:10px;letter-spacing:2px;color:var(--dim);text-transform:uppercase;padding:8px 4px;border-bottom:1px solid var(--bdr2)}
td{padding:10px 4px;border-top:1px solid rgba(255,255,255,0.04)}

/* ══════ HERO del home — banda cinematográfica ══════ */
.st-hero{
  position:relative;
  padding:58px 18px 22px;
  overflow:hidden;
  background:
    linear-gradient(180deg, rgba(0,0,0,0.4) 0%, transparent 60%),
    linear-gradient(180deg, #0a1410 0%, #070c0a 100%);
  border-bottom:1px solid var(--bdr);
  box-shadow:0 10px 30px rgba(0,0,0,0.55), inset 0 -1px 0 rgba(244,198,107,0.12);
}
/* Reflector desde arriba izquierda, estático */
.st-hero-lights{
  position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(ellipse 60% 80% at 8% -20%, rgba(244,198,107,0.35), transparent 55%),
    radial-gradient(ellipse 60% 80% at 92% -20%, rgba(200,230,255,0.12), transparent 55%),
    radial-gradient(ellipse 100% 50% at 50% 110%, rgba(60,120,90,0.25), transparent 60%);
}
/* Malla tenue de cancha (líneas de cal) en el borde inferior */
.st-hero-grid{
  position:absolute;left:0;right:0;bottom:0;height:36px;pointer-events:none;opacity:.35;
  background:
    linear-gradient(90deg, transparent 0%, rgba(238,242,234,0.16) 48%, rgba(238,242,234,0.24) 50%, rgba(238,242,234,0.16) 52%, transparent 100%),
    linear-gradient(0deg, rgba(238,242,234,0.08), transparent 90%);
  mask-image:linear-gradient(180deg, transparent, #000 60%);
}
.st-hero-inner{position:relative;z-index:2}
.st-hero-top{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.st-hero-crest{
  position:relative;width:52px;height:52px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
}
.st-hero-crest-ring{
  position:absolute;inset:0;border-radius:50%;
  border:1px solid rgba(244,198,107,0.5);
  box-shadow:0 0 0 3px rgba(79,142,247,0.08), inset 0 0 18px rgba(244,198,107,0.25);
}
.st-hero-crest-ring::after{
  content:'';position:absolute;inset:4px;border-radius:50%;
  border:1px dashed rgba(244,198,107,0.22);
}
.st-hero-crest-core{
  font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;
  color:var(--reflector);text-shadow:0 0 14px rgba(244,198,107,0.55);
}
.st-hero-kicker{
  font-family:'Barlow Condensed',sans-serif;font-weight:900;
  font-size:10px;letter-spacing:4px;color:var(--reflector);
  text-transform:uppercase;opacity:.9;margin-bottom:4px;
}
.st-hero-hello{
  font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:3px;
  color:var(--off-white);line-height:1;
}
.st-hero-hello span{color:var(--white);text-shadow:0 0 18px rgba(244,198,107,0.25)}

.st-hero-match{
  display:flex;align-items:stretch;gap:12px;
  padding:14px 14px;border-radius:10px;
  background:linear-gradient(180deg, rgba(255,255,255,0.035), rgba(255,255,255,0.01));
  border:1px solid var(--bdr);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.04), 0 6px 16px rgba(0,0,0,0.45);
}
.st-hero-match-left{flex:1;min-width:0}
.st-hero-match-label{
  font-family:'Barlow Condensed',sans-serif;font-weight:800;
  font-size:9px;letter-spacing:3px;color:var(--muted);text-transform:uppercase;margin-bottom:4px;
}
.st-hero-match-date{
  font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;
  color:var(--white);line-height:1;
}
.st-hero-match-meta{
  font-size:11px;color:var(--muted);margin-top:6px;letter-spacing:.3px;
}
.st-hero-match-right{
  flex-shrink:0;min-width:90px;
  display:flex;align-items:center;justify-content:center;
  padding:6px 12px;border-radius:8px;
  background:linear-gradient(180deg, rgba(244,198,107,0.14), rgba(244,198,107,0.05));
  border:1px solid rgba(79,142,247,0.25);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.06), 0 0 22px rgba(244,198,107,0.12);
}
.st-hero-dial{
  font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:2px;
  color:var(--reflector);text-shadow:0 0 12px rgba(244,198,107,0.6);
  white-space:nowrap;text-align:center;line-height:1.1;
}

/* ══════ MATCH DETAIL — "Scoreboard cinematográfico" ══════ */
.mx-scoreboard{
  position:relative;
  margin:4px 0 18px;
  padding:18px 14px 16px;
  border-radius:10px;
  background:
    linear-gradient(180deg, rgba(244,198,107,0.04), transparent 30%),
    linear-gradient(180deg, #0a1410 0%, #060c0a 100%);
  border:1px solid var(--bdr);
  border-top:1px solid rgba(244,198,107,0.25);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.04),
    inset 0 -1px 0 rgba(0,0,0,0.5),
    0 12px 32px rgba(0,0,0,0.55),
    0 0 40px rgba(244,198,107,0.04);
  overflow:hidden;
}
.mx-scoreboard::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(79,142,247,0.35) 50%,transparent);
}
.mx-sb-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;position:relative;z-index:2}
.mx-sb-team{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-width:0}
.mx-sb-team-r{align-items:flex-end;text-align:right}
.mx-sb-badge{
  width:44px;height:44px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%, color-mix(in srgb, var(--tc) 65%, #000) 0%, color-mix(in srgb, var(--tc) 25%, #000) 65%, #000 100%);
  border:1.5px solid var(--tc);
  box-shadow:inset 0 -4px 10px rgba(0,0,0,0.5), 0 0 18px color-mix(in srgb, var(--tc) 40%, transparent);
  position:relative;
}
.mx-sb-badge::after{
  content:'';position:absolute;inset:5px;border-radius:50%;
  border:1px solid rgba(255,255,255,0.1);
}
.mx-sb-name{
  font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;
  color:var(--tc);line-height:1;text-shadow:0 0 18px color-mix(in srgb, var(--tc) 40%, transparent);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;
}
.mx-sb-count{
  font-family:'Barlow Condensed',sans-serif;font-weight:900;
  font-size:16px;color:var(--off-white);letter-spacing:1px;
}
.mx-sb-count span{font-size:9px;color:var(--muted);font-weight:700;letter-spacing:2px}
.mx-sb-vs{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:0 6px;min-width:70px;
}
.mx-sb-vs-label{
  font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:3px;
  color:var(--reflector);line-height:1;
  text-shadow:0 0 24px rgba(244,198,107,0.5);
}
.mx-sb-kick{
  font-family:'Barlow Condensed',sans-serif;font-weight:700;
  font-size:10px;color:var(--muted);letter-spacing:1.5px;text-align:center;line-height:1.5;
}
.mx-sb-kick div:first-child{color:var(--off-white);font-weight:900}
.mx-sb-stripe{
  position:absolute;left:0;right:0;bottom:0;height:3px;
  background:linear-gradient(90deg,
    color-mix(in srgb, var(--bdr) 40%, transparent) 0%,
    rgba(79,142,247,0.35) 50%,
    color-mix(in srgb, var(--bdr) 40%, transparent) 100%);
}

/* Roster — formación en dos columnas tipo programa de fútbol */
.mx-roster{
  position:relative;display:grid;grid-template-columns:1fr 1px 1fr;gap:10px;
  padding:14px 4px 18px;margin-bottom:4px;
  background:
    linear-gradient(180deg, rgba(10,20,16,0.4), transparent),
    linear-gradient(180deg, rgba(0,0,0,0.2), rgba(0,0,0,0.4));
  border-radius:10px;
  border:1px solid var(--bdr);
  overflow:hidden;
}
.mx-roster::before{
  content:'';position:absolute;inset:0;pointer-events:none;opacity:.22;
  background:
    /* líneas de cancha horizontales */
    repeating-linear-gradient(180deg, transparent 0 60px, rgba(238,242,234,0.05) 60px 61px),
    /* centro de cancha circular */
    radial-gradient(circle at 50% 50%, transparent 40px, rgba(238,242,234,0.06) 41px, transparent 43px);
}
.mx-divider{
  background:linear-gradient(180deg, transparent, rgba(238,242,234,0.14), transparent);
  position:relative;z-index:2;
}
.mx-side{padding:0 8px;position:relative;z-index:2}
.mx-side-head{
  font-family:'Barlow Condensed',sans-serif;font-weight:900;
  font-size:9px;letter-spacing:2.5px;color:var(--tc);
  padding:6px 8px;margin-bottom:10px;text-transform:uppercase;
  border-left:2px solid var(--tc);
  text-shadow:0 0 12px color-mix(in srgb, var(--tc) 40%, transparent);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.mx-side-r .mx-side-head{border-left:none;border-right:2px solid var(--tc);text-align:right}
.mx-row{
  display:flex;align-items:center;gap:8px;padding:7px 8px;
  border-radius:7px;margin-bottom:5px;
  background:linear-gradient(90deg, color-mix(in srgb, var(--tc) 8%, transparent), transparent);
  border:1px solid color-mix(in srgb, var(--tc) 12%, transparent);
  position:relative;
}
.mx-side-r .mx-row{flex-direction:row-reverse;background:linear-gradient(270deg, color-mix(in srgb, var(--tc) 8%, transparent), transparent)}
.mx-row-num{display:none}
.mx-row-av{
  width:30px;height:30px;border-radius:50%;overflow:hidden;flex-shrink:0;
  background:linear-gradient(135deg, color-mix(in srgb, var(--tc) 25%, #0a0a0a), #0a0a0a);
  border:1.5px solid color-mix(in srgb, var(--tc) 60%, transparent);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 8px rgba(0,0,0,0.5);
}
.mx-row-name{
  flex:1;min-width:0;font-size:13px;font-weight:700;color:var(--off-white);
  font-family:'Barlow',sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.2px;
}
.mx-side-r .mx-row-name{text-align:right}
.mx-row-me{
  background:linear-gradient(90deg, color-mix(in srgb, var(--tc) 22%, transparent), color-mix(in srgb, var(--tc) 4%, transparent));
  border:1px solid var(--tc);
  box-shadow:0 0 18px color-mix(in srgb, var(--tc) 20%, transparent), inset 0 1px 0 rgba(255,255,255,0.08);
}
.mx-side-r .mx-row-me{background:linear-gradient(270deg, color-mix(in srgb, var(--tc) 22%, transparent), color-mix(in srgb, var(--tc) 4%, transparent))}
.mx-row-me .mx-row-name{color:#fff;font-weight:900}
.mx-row-me-tag{
  font-family:'Barlow Condensed',sans-serif;font-weight:900;
  font-size:8px;letter-spacing:2px;padding:2px 6px;border-radius:3px;
  background:var(--tc);color:#000;flex-shrink:0;
}

/* ══════ RANKING — "Tabla de Liga" ══════ */
.rk-podium{
  display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:8px;
  align-items:end;margin:6px 0 22px;
  padding:14px 6px 12px;
  border-radius:10px;
  background:
    radial-gradient(ellipse 80% 40% at 50% -5%, rgba(79,142,247,0.1), transparent 60%),
    linear-gradient(180deg, #0a1410, #060c0a);
  border:1px solid var(--bdr);
  border-top:1px solid rgba(79,142,247,0.25);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.04), 0 10px 28px rgba(0,0,0,0.55);
  position:relative;overflow:hidden;
}
.rk-podium::before{
  content:'';position:absolute;left:0;right:0;bottom:0;height:3px;
  background:linear-gradient(90deg, transparent, rgba(79,142,247,0.35) 50%, transparent);
}
.rk-pod{
  position:relative;padding:10px 8px 12px;border-radius:8px;
  background:linear-gradient(180deg, color-mix(in srgb, var(--pc) 10%, transparent), color-mix(in srgb, var(--pc) 3%, transparent));
  border:1px solid color-mix(in srgb, var(--pc) 30%, transparent);

  return 'es'; // Default to Spanish — user can switch manually
}

})();

'use strict';
// ═══════ CONFIG & RAW REST API (no SDK) ═══════
const CFG_KEY = 'emb_sb_v1';
let _CFG = null; // {url, key}

function loadCfg() {
  try {
    if (location.hash && location.hash.length > 2) {
      const d = JSON.parse(atob(location.hash.slice(1)));
      if (d.url && d.key) { localStorage.setItem(CFG_KEY, JSON.stringify(d)); return d; }
    }
  } catch(e) {}
  try { return JSON.parse(localStorage.getItem(CFG_KEY)) || null; } catch { return null; }
}
function saveCfg(c) { localStorage.setItem(CFG_KEY, JSON.stringify(c)); }
function getShareLink(c) {
  // No credentials needed — they're hardcoded in the app
  return 'https://tinyurl.com/emabol';
}

// Pure REST DB layer — no SDK, no postMessage, no DataCloneError
function _errMsg(e) {
  if (!e) return 'Error desconocido';
  if (typeof e === 'string') return e;
  return e.message || e.details || e.hint || JSON.stringify(e);
}
function _plain(x) {
  if (x == null) return x;
  return JSON.parse(JSON.stringify(x));
}
function _h() {
  var k = _CFG.key;
  return {
    'Content-Type': 'application/json',
    'apikey': k,
    'Authorization': 'Bearer ' + k
  };
}
function _base() { return _CFG.url + '/rest/v1'; }
async function _req(method, path, body) {
  var opts = { method: method, headers: Object.assign({}, _h()) };
  if (method === 'POST' || method === 'PATCH') {
    opts.headers['Prefer'] = 'resolution=merge-duplicates,return=minimal';
  }
  if (body != null) opts.body = JSON.stringify(body);
  var res = await fetch(_base() + path, opts);
  var txt = await res.text();
  if (!res.ok) {
    var msg = 'HTTP ' + res.status;
    try { var j = JSON.parse(txt); msg = j.message || j.details || j.hint || msg; } catch(e) {}
    throw new Error(msg);
  }
  if (!txt) return null;
  try { return JSON.parse(txt); } catch(e) { return null; }
}
// ── In-memory cache to reduce Supabase IO ────────────────────────────────────
const _cache = {};
const _CACHE_TTL = 60000; // 60 seconds

// Tables filtered by liga_id
const LIGA_TABLES = new Set(['jugadores','torneos','convocatorias','partidos','ranking','config','auth_pending','brackets']);

async function getAll(table) {
  const now = Date.now();
  // Convocatorias change frequently — use shorter TTL
  const ttl = table === 'convocatorias' ? 10000 : _CACHE_TTL;
  if(_cache[table] && (now - _cache[table].ts) < ttl) {
    return _cache[table].data;
  }
  const ligaSuffix = LIGA_TABLES.has(table) && getLigaId() ? '&liga_id=eq.'+getLigaId() : '';
  var r = await _req('GET', '/' + table + '?select=*' + ligaSuffix);
  var data = _plain(r) || [];
  _cache[table] = { data, ts: now };
  return data;
}

function invalidateCache(table) {
  if(table) delete _cache[table];
  else Object.keys(_cache).forEach(k => delete _cache[k]);
}
async function getJugadores(withFoto) {
  const ckey = 'jugadores_' + (withFoto?'full':'slim');
  const now = Date.now();
  if(_cache[ckey] && (now - _cache[ckey].ts) < _CACHE_TTL) {
    return _cache[ckey].data;
  }
  var fields = withFoto ? '*' : 'id,nombre,pos,rating,stats,convocado,clave,created_at,auth_user_id,email,admin';
  var r = await _req('GET', '/jugadores?select=' + fields);
  var data = _plain(r) || [];
  _cache[ckey] = { data, ts: now };
  return data;
}
async function getOne(table, id) {
  var r = await _req('GET', '/' + table + '?select=*&id=eq.' + encodeURIComponent(id));
  var rows = _plain(r);
  return (rows && rows.length) ? rows[0] : null;
}
async function upsertRow(table, row) {
  // Auto-inject liga_id for liga-scoped tables
  if(typeof LIGA_TABLES !== 'undefined' && LIGA_TABLES.has(table) && !row.liga_id && getLigaId()) {
    row = {...row, liga_id: getLigaId()};
  }
  await _req('POST', '/' + table, _plain(row));
  // Invalidate AFTER write so next read gets fresh data
  invalidateCache(table);
  if(table === 'jugadores') { invalidateCache('jugadores_full'); invalidateCache('jugadores_slim'); }
}
async function delRow(table, id) {
  await _req('DELETE', '/' + table + '?id=eq.' + encodeURIComponent(id), null);
}
async function delWhere(table, col, val) {
  await _req('DELETE', '/' + table + '?' + col + '=eq.' + encodeURIComponent(val), null);
}

// ═══════ AUTH ═══════
let ME = null;
try { ME = JSON.parse(sessionStorage.getItem('emb_me')) || null; } catch(e) {}
async function loginAsync(u, p) {
  u = u.trim();
  if(!u) return {ok:false, msg:'Ingresá tu email'};
  if(!p) return {ok:false, msg:'Ingresá tu contraseña'};

  // Admin login — keep as-is
  if(u === 'emabol' && p === 'emabol') {
    const m = {n:'emabol', admin:true, jid:null};
    ME = m; sessionStorage.setItem('emb_me', JSON.stringify(m));
    await restoreTorneo().catch(()=>{});
    await loadLiga().catch(()=>{});
    initPush().catch(()=>{});
    return {ok:true};
  }

  // Email login via Supabase Auth
  try {
    const data = await authSignIn(u, p);
    const authId = data.user?.id;
    if(!authId) return {ok:false, msg:'Error de autenticación.'};

    // Find linked jugador
    const jugador = await getJugadorByAuthId(authId);
    if(!jugador) {
      // Check if pending approval
      const pending = await _req('GET', '/auth_pending?email=eq.' + encodeURIComponent(u) + '&select=estado').catch(()=>[]);
      const pRows = _plain(pending) || [];
      if(pRows.length > 0) {
        return {ok:false, msg:'Tu cuenta está pendiente de aprobación por el admin. Te avisarán cuando esté lista.'};
      }
      return {ok:false, msg:'Tu email no está vinculado a ningún jugador. Contactá al admin.'};
    }

    const m = {n: jugador.nombre, admin: jugador.admin || false, jid: jugador.id, email: u, token: data.access_token, liga_id: jugador.liga_id || 'liga_emabol'};
    ME = m;
    sessionStorage.setItem('emb_me', JSON.stringify(m));
    await restoreTorneo().catch(()=>{});
    return {ok:true};
  } catch(e) {
    console.error('Login error:', e);
    return {ok:false, msg: e.message || 'Error al iniciar sesión'};
  }
}
function logout() { ME=null; sessionStorage.removeItem('emb_me'); }

function card(j,sz='md'){
  const S={sm:152,md:212,lg:280};const w=S[sz],h=Math.round(w*1.42);
  const pc=PC[j.pos]||'#00d4ff';
  const posLabel=j.pos==='ARQ'?'ARQ':'JUG';
  const fw=w*.22,fp=w*.10,fn=w*.090,fl=w*.058;
  const ph=j.foto?`<img src="${j.foto}" style="width:100%;height:100%;object-fit:cover" alt=""/>`:
    `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:${w*.28}px">⚽</div>`;
  return `<div style="width:${w}px;height:${h}px;border-radius:${w*.07}px;background:linear-gradient(160deg,${pc}44,${pc}11,#05050f);border:1.5px solid ${pc}55;position:relative;overflow:hidden;flex-shrink:0;font-family:'Barlow Condensed',sans-serif">
    <div style="position:absolute;top:${w*.08}px;left:${w*.08}px;text-align:center;z-index:2">
      <p style="font-size:${fw}px;font-weight:900;color:var(--txt);line-height:1">—</p>
      <p style="font-size:${fp}px;font-weight:800;color:${pc};letter-spacing:1px;line-height:1.1">${posLabel}</p>
    </div>
    <div style="position:absolute;top:${w*.05}px;left:50%;transform:translateX(-50%);width:${w*.55}px;height:${w*.55}px;border-radius:50%;overflow:hidden;border:2px solid ${pc}55;background:${pc}18">${ph}</div>
    <div style="position:absolute;bottom:${w*.08}px;left:0;right:0;text-align:center;z-index:2;padding:0 ${w*.05}px">
      <p style="font-size:${fn}px;font-weight:900;color:var(--txt);letter-spacing:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${(j.nombre||'').toUpperCase()}</p>
    </div>
  </div>`;
}

function renderNav(){

  const items=[
    {i:'🏠',l:tr('home'),p:'/home'},
    ...(ME&&ME.admin?[{i:'👥',l:tr('players'),p:'/players'}]:[]),
    {i:'🏆',l:tr('ranking'),p:'/ranking'},

  ];
  const nav=items.map(it=>{

      style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;

}

window.guardarNovedades=async function(){
  var ta=document.getElementById('nov-ta');
  if(!ta)return;
  var val=ta.value.trim();
  try{
    await upsertRow('config',{id:'novedades',valor:val});
    var ov=document.getElementById('nov-ov');
    if(ov)ov.remove();
    go('/home');
  }catch(e){alert('Error: '+_errMsg(e));}
};

async function render(){
  try{
    if(!ME&&R!=='/login'&&R!=='/setup'&&R!=='/forgot'&&R!=='/crear-liga'){R='/login';RP={};}
    if(R==='/setup'){sSetup();return;}
    if(R==='/login'){sLogin();return;}
    if(R==='/forgot'){sForgot();return;}
    if(R==='/crear-liga'){await sCrearLiga();return;}
    // Auto-close expired votaciones
    try {
      const now = Date.now();
      const partidos = await getAll('partidos').catch(()=>[]);
      const expired = partidos.filter(p => p.votacion_abierta && p.votacion_cierre && now > p.votacion_cierre);
      for(const p of expired) {
        await window.cerrarVotacion(p.id);
      }
    } catch(e) {}

    // Check maintenance for non-admin players
    if(ME && !ME.admin) {
      try {
        const torneos = await getAll('torneos').catch(()=>[]);
        const activeTorneos = torneos.filter(t=>t.estado!=='archivado');
        const enMantenimiento = activeTorneos.filter(t=>t.app_estado==='mantenimiento');
        if(enMantenimiento.length > 0 && enMantenimiento.length === activeTorneos.length) {
          sMantenimiento(enMantenimiento[0].nombre);
          return;
        }
      } catch(e) {}
    }
    if(R==='/home'){
      // Check if player needs to vote before seeing home
      const needsVote = ME && ME.jid ? await checkAndShowVoting() : false;
      if(needsVote) return;
      await sHome();return;
    }
    if(R==='/ranking'||R==='/players'||R==='/match'){
      if(!CURRENT_TORNEO){go('/torneos');return;}
    }
    if(R==='/register'){sRegister();return;}
    if(R==='/pending-auth'){if(ME?.admin) await sPendingAuth(); else go('/home'); return;}
    if(R==='/torneos'){await sTorneos();return;}
    if(R==='/torneo-new'){await sTorneoForm('');return;}
    if(R==='/torneo-edit'){await sTorneoForm(RP.tid);return;}
    if(R==='/equipos'){await sEquipos(RP.tid);return;}
    if(R==='/habilitar-fechas'){await sHabilitarFechas(RP.tid);return;}
    if(R==='/equipo-form'){await sEquipoForm(RP.tid, RP.equipoId);return;}
    if(R==='/players'){await sPlayers();return;}
    if(R==='/player'){await sPlayer(RP);return;}
    if(R==='/player-form'){await sPForm(RP);return;}
    if(R==='/ranking'){await sRanking(RP);return;}
    if(R==='/match'){await sProximos();return;}
    if(R==='/convocatoria'){await sConvocatoria(RP);return;}
    if(R==='/cargar-resultado'){await sMatch();return;}
    if(R==='/resultado-form'){await sResultadoForm(RP);return;}
    if(R==='/ayuda'){await sAyuda();return;}
    R='/home';await sHome();
  }catch(e){
    console.error('render error:',e);
    setContent(`<div class="screen" style="display:flex;align-items:center;justify-content:center;min-height:100dvh;padding:22px;flex-direction:column;gap:14px"><span style="font-size:44px">⚠️</span><p style="color:var(--dim);font-size:13px">${_errMsg(e)}</p><button class="btn btn-gold" onclick="render()">Reintentar</button></div>`);
  }
}

window.doSetup=async function(){
  var rawUrl=document.getElementById('s-url').value.trim().replace(/\/$/,'');
  var key=document.getElementById('s-key').value.trim();
  if(!rawUrl||!key){sSetup('Completá los dos campos.');return;}
  // Normalize URL
  var url=rawUrl;
  if(!url.startsWith('http'))url='https://'+url;
  _CFG = {url, key};
  saveCfg({url, key});
  setContent(loading('Verificando conexión...'));
  try {
    var _tr = await _req('GET', '/torneos?select=id&limit=1');
    setContent(loading('Inicializando datos...'));
    await seedData();
    go('/login');
  } catch(e) {
    sSetup('No se pudo conectar: ' + e.message);
  }
};

// BRACKET — Eliminación directa
// ═══════════════════════════════════════════════════════════

function nextPow2(n) { let p=1; while(p<n) p*=2; return p; }

function generarBracket(equipos) {
  const n = equipos.length;
  const slots = nextPow2(n);
  const byes = slots - n;
  const sembrados = [];
  let byeIdx=0, eqIdx=0;
  const step = byes > 0 ? Math.floor(slots/byes) : slots+1;
  for(let i=0; i<slots; i++){
    if(byeIdx<byes && i%step===0){
      sembrados.push({id:'bye_'+byeIdx, nombre:'BYE', bye:true});
      byeIdx++;
    } else {
      sembrados.push(equipos[eqIdx++]||{id:'bye_'+byeIdx++,nombre:'BYE',bye:true});
    }
  }
  const totalRondas = Math.log2(slots);
  const rondas = [];
  const ronda1 = {nombre: totalRondas>1 ? 'Ronda 1' : 'Final', partidos:[]};
  for(let i=0; i<slots; i+=2){
    const eqA=sembrados[i], eqB=sembrados[i+1];
    const ganador = eqA.bye ? eqB.id : eqB.bye ? eqA.id : null;
    ronda1.partidos.push({
      id:'p_r1_'+(i/2), equipo_a:eqA.bye?null:eqA.id, equipo_b:eqB.bye?null:eqB.id,
      nombre_a:eqA.nombre, nombre_b:eqB.nombre,
      bye_a:eqA.bye||false, bye_b:eqB.bye||false, ganador, auto_avance:!!ganador
    });
  }
  rondas.push(ronda1);
  const nombres = ['','Final','Semifinal','Cuartos','Octavos','Dieciseisavos'];
  for(let r=2; r<=totalRondas; r++){
    const pn = slots/Math.pow(2,r);
    const nombre = nombres[totalRondas-r+1]||('Ronda '+r);
    rondas.push({nombre, partidos:Array.from({length:pn},(_,i)=>({
      id:'p_r'+r+'_'+i, equipo_a:null, nombre_a:'-', equipo_b:null, nombre_b:'-',
      ganador:null, auto_avance:false
    }))});
  }
  return rondas;
}

function avanzarGanador(rondas, ri, pi, ganadorId, ganadorNombre) {
  const r2 = JSON.parse(JSON.stringify(rondas));
  r2[ri].partidos[pi].ganador = ganadorId;
  if(ri+1 < r2.length){
    const np = Math.floor(pi/2);
    const esA = pi%2===0;
    const p = r2[ri+1].partidos[np];
    if(esA){ p.equipo_a=ganadorId; p.nombre_a=ganadorNombre; }
    else   { p.equipo_b=ganadorId; p.nombre_b=ganadorNombre; }
  }
  return r2;
}

// ── sCrearBracket ─────────────────────────────────────────────────
async function sCrearBracket(p) {
  if(!ME?.admin){ go('/home'); return; }
  const tid = p?.tid || CURRENT_TORNEO?.id;
  if(!tid){ alert('Seleccioná un torneo'); go('/torneos'); return; }
  setContent(loading('Cargando equipos...'));
  const [eqs, bList] = await Promise.all([
    getAll('equipos').then(eq=>eq.filter(e=>e.tid===tid)),
    _req('GET','/brackets?tid=eq.'+tid+'&liga_id=eq.'+getLigaId()+'&limit=1').catch(()=>[])
  ]);
  if(bList?.length){ window._bracketId=bList[0].id; go('/bracket',{tid}); return; }
  if(eqs.length<2){
    const html = '<div class="screen up" style="padding:44px 16px 90px">'
      + '<button class="bk" onclick="go(\'/home\')">&#8592; VOLVER</button>'
      + '<h2 style="font-family:\'Bebas Neue\',sans-serif;font-size:28px;letter-spacing:3px;margin:8px 0 20px">BRACKET</h2>'
      + '<div style="background:var(--card);border:1px solid var(--bdr2);border-radius:12px;padding:24px;text-align:center">'
      + '<p style="font-size:32px;margin-bottom:12px">&#9888;&#65039;</p>'
      + '<p style="color:var(--muted);font-size:14px">Necesit&#225;s al menos 2 equipos para crear un bracket.</p>'
      + '</div></div>';
    setContent(html); return;
  }
  const slots = nextPow2(eqs.length);
  const byes = slots - eqs.length;
  const eqCards = eqs.map(e=>'<div style="background:var(--surf);border:1px solid '+(e.color||'var(--bdr2)')+';border-radius:8px;padding:10px 12px;display:flex;align-items:center;gap:8px">'
    + '<div style="width:10px;height:10px;border-radius:50%;background:'+(e.color||'var(--muted)')+'"></div>'
    + '<span style="font-family:\'Barlow Condensed\',sans-serif;font-weight:900;font-size:14px">'+e.nombre+'</span></div>'
  ).join('');
  const html2 = '<div class="screen up" style="padding:44px 16px 90px">'
    + '<button class="bk" onclick="go(\'/home\')">&#8592; VOLVER</button>'
    + '<h2 style="font-family:\'Bebas Neue\',sans-serif;font-size:28px;letter-spacing:3px;margin:8px 0 4px">CREAR BRACKET</h2>'
    + '<p style="font-size:12px;color:var(--dim);margin-bottom:20px">'+eqs.length+' equipos &middot; '+slots+' slots &middot; '+byes+' bye'+(byes!==1?'s':'')+'</p>'
    + '<p class="sec-title">EQUIPOS PARTICIPANTES</p>'
    + '<div style="display:flex;flex-direction:column;gap:8px;margin-bottom:24px">'+eqCards+'</div>'
    + '<button onclick="window.confirmarBracket(\''+tid+'\')" class="btn btn-gold" style="letter-spacing:2px">&#127942; GENERAR BRACKET</button>'
    + '</div>';
  setContent(html2);
  window._bracketEquipos = eqs;
}

window.confirmarBracket = async function(tid) {
  const equipos = window._bracketEquipos||[];
  if(!equipos.length){ alert('Sin equipos'); return; }
  try {
    setContent(loading('Generando bracket...'));
    const rondas = generarBracket(equipos.map(e=>({id:e.id,nombre:e.nombre,color:e.color})));
    const bid = 'bracket_'+Date.now().toString(36);
    await _req('POST','/brackets',{
      id:bid, tid, liga_id:getLigaId(),
      nombre:'Bracket '+(CURRENT_TORNEO?.nombre||''),
      estado:'en_curso',
      equipos:equipos.map(e=>({id:e.id,nombre:e.nombre,color:e.color})),
      rondas
    });
    invalidateCache('brackets');
    window._bracketId = bid;
    go('/bracket',{tid});
  } catch(e){ alert('Error: '+_errMsg(e)); }

// ── sBracket ──────────────────────────────────────────────────────
async function sBracket(p) {
  setContent(loading('Cargando bracket...'));
  const tid = p?.tid || CURRENT_TORNEO?.id;
  const bList = await _req('GET','/brackets?tid=eq.'+tid+'&liga_id=eq.'+getLigaId()+'&limit=1').catch(()=>[]);
  const bracket = bList?.[0];
  if(!bracket){ go('/crear-bracket',{tid}); return; }
  window._bracket = bracket;
  const rondas = bracket.rondas||[];
  const isAdmin = ME?.admin;

  const teamRow = function(nombre, isGan, isBye) {
    return '<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 10px;'
      + 'background:'+(isGan?'rgba(0,230,118,0.08)':'var(--surf2)')
      + ';border-left:3px solid '+(isGan?'var(--green)':isBye?'var(--dim)':'var(--bdr2)')
      + ';border-radius:0 4px 4px 0;margin-bottom:2px;opacity:'+(isBye?'0.4':'1')+'">'
      + '<span style="font-family:\'Barlow Condensed\',sans-serif;font-weight:900;font-size:13px;color:'+(isGan?'var(--green)':'var(--txt)')+'">'+nombre+'</span>'
      + (isGan?'<span style="font-size:14px">&#10003;</span>':'')
      + '</div>';
  };

  const rondasHtml = rondas.map(function(ronda, ri) {
    const partidos = ronda.partidos.map(function(part, pi) {
      const ganA = part.ganador===part.equipo_a;
      const ganB = part.ganador===part.equipo_b;
      const jugado = !!part.ganador;
      const esBye = part.bye_a||part.bye_b;
      let btnCargar = '';
      if(isAdmin && !jugado && !esBye && part.equipo_a && part.equipo_b){
        btnCargar = '<button onclick="window.cargarResultadoBracket(\''+bracket.id+'\','+ri+','+pi+',\''+part.nombre_a+'\',\''+part.nombre_b+'\')"'
          + ' style="width:100%;margin-top:6px;padding:7px;border-radius:6px;border:none;'
          + 'background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;'
          + 'font-family:\'Barlow Condensed\',sans-serif;font-weight:900;font-size:11px;'
          + 'letter-spacing:1.5px;cursor:pointer">&#128202; CARGAR RESULTADO</button>';
      }
      return '<div style="margin-bottom:10px;background:var(--card);border:1px solid var(--bdr2);border-radius:8px;padding:8px;min-width:160px">'
        + teamRow(part.nombre_a||'?', ganA, part.bye_a)
        + teamRow(part.nombre_b||'?', ganB, part.bye_b)
        + btnCargar
        + (esBye&&!jugado?'<p style="font-size:9px;color:var(--dim);text-align:center;margin-top:4px">BYE &#8212; avance autom&#225;tico</p>':'')
        + '</div>';
    }).join('');
    return '<div style="margin-right:16px;min-width:180px;flex-shrink:0">'
      + '<p style="font-family:\'Barlow Condensed\',sans-serif;font-weight:900;font-size:10px;'
      + 'letter-spacing:3px;color:var(--red);margin-bottom:10px;text-transform:uppercase">'+ronda.nombre+'</p>'
      + partidos + '</div>';
  }).join('');

  let campeonHtml = '';
  if(bracket.campeon){
    const campNombre = (bracket.equipos||[]).find(function(e){return e.id===bracket.campeon;})?.nombre||'?';
    campeonHtml = '<div style="background:linear-gradient(135deg,rgba(255,215,0,0.1),rgba(255,215,0,0.05));'
      + 'border:2px solid rgba(255,215,0,0.4);border-radius:14px;padding:20px;text-align:center;margin-bottom:20px">'
      + '<p style="font-size:36px;margin-bottom:8px">&#127942;</p>'
      + '<p style="font-family:\'Barlow Condensed\',sans-serif;font-weight:900;font-size:10px;letter-spacing:3px;color:var(--gold);margin-bottom:4px">CAMP&#201;ON</p>'
      + '<p style="font-family:\'Bebas Neue\',sans-serif;font-size:28px;letter-spacing:3px;color:var(--gold)">'+campNombre+'</p>'
      + '</div>';
  }

  const html = '<div class="screen up" style="padding:44px 0 90px">'
    + '<div style="padding:0 16px">'
    + '<button class="bk" onclick="go(\'/home\')">&#8592; VOLVER</button>'
    + '<h2 style="font-family:\'Bebas Neue\',sans-serif;font-size:28px;letter-spacing:3px;margin:8px 0 4px">'+bracket.nombre+'</h2>'
    + '<p style="font-size:12px;color:var(--dim);margin-bottom:16px">'+(bracket.equipos?.length||0)+' equipos &middot; Eliminaci&#243;n directa</p>'
    + campeonHtml
    + '</div>'
    + '<div style="overflow-x:auto;padding:0 16px 16px">'
    + '<div style="display:flex;align-items:flex-start;min-width:max-content">'+rondasHtml+'</div>'
    + '</div></div>';
  setContent(html);
}

window.cargarResultadoBracket = function(bracketId, ri, pi, nombreA, nombreB) {
  const b = window._bracket;
  if(!b) return;
  const part = b.rondas[ri].partidos[pi];
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:999;display:flex;align-items:center;justify-content:center;padding:20px';
  overlay.innerHTML = '<div style="background:var(--card);border:1px solid var(--bdr2);border-radius:14px;padding:24px;width:100%;max-width:320px">'
    + '<h3 style="font-family:\'Bebas Neue\',sans-serif;font-size:22px;letter-spacing:2px;margin-bottom:16px;text-align:center">RESULTADO</h3>'
    + '<p style="font-size:12px;color:var(--dim);text-align:center;margin-bottom:16px">'+nombreA+' vs '+nombreB+'</p>'
    + '<button onclick="window._setGanadorBracket(\''+bracketId+'\','+ri+','+pi+',\''+part.equipo_a+'\',\''+nombreA+'\')" class="btn btn-out" style="margin-bottom:8px">&#127942; '+nombreA+'</button>'
    + '<button onclick="window._setGanadorBracket(\''+bracketId+'\','+ri+','+pi+',\''+part.equipo_b+'\',\''+nombreB+'\')" class="btn btn-out" style="margin-bottom:8px">&#127942; '+nombreB+'</button>'
    + '<button onclick="document.querySelector(\'[data-overlay]\').remove()" class="btn btn-dim">CANCELAR</button>'
    + '</div>';
  overlay.setAttribute('data-overlay','1');
  document.body.appendChild(overlay);
};

window._setGanadorBracket = async function(bracketId, ri, pi, ganadorId, ganadorNombre) {
  document.querySelector('[data-overlay]')?.remove();
  try {
    setContent(loading('Actualizando bracket...'));
    const b = window._bracket;
    let rondas = avanzarGanador(b.rondas, ri, pi, ganadorId, ganadorNombre);
    const esUltima = ri===rondas.length-1;
    const campeon = esUltima ? ganadorId : (b.campeon||null);
    const estado = campeon ? 'finalizado' : 'en_curso';
    await _req('PATCH','/brackets?id=eq.'+bracketId,{rondas, campeon, estado});
    invalidateCache('brackets');
    const updated = await _req('GET','/brackets?id=eq.'+bracketId+'&limit=1');
    window._bracket = updated?.[0]||b;
    sBracket({tid:b.tid});
  } catch(e){ alert('Error: '+_errMsg(e)); }
};

// ── Date helper — days until a DD/MM/YYYY date (negative if past) ────────────
function diasHasta(fechaStr) {
  if(!fechaStr) return 0;  // treat missing date as today
  const parts = fechaStr.split('/');
  if(parts.length < 3) return 0;
  const d = new Date(parseInt(parts[2]), parseInt(parts[1])-1, parseInt(parts[0]));
  if(isNaN(d.getTime())) return 0;
  const today = new Date(); today.setHours(0,0,0,0);
  return Math.round((d - today) / 86400000);
}

// Parse DD/MM/YYYY → Date
function parseFecha(str) {
  if(!str) return null;
  const p = str.split('/');
  if(p.length < 3) return null;
  return new Date(parseInt(p[2]), parseInt(p[1])-1, parseInt(p[0]));
}

// Format Date → "Sáb 21 Mar"
function fmtFecha(d) {
  if(!d) return '';
  const dias = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  const meses = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  return dias[d.getDay()]+' '+d.getDate()+' '+meses[d.getMonth()];
}

// Format DD/MM/YYYY → "Sáb 21 Mar" (short, from string)
function fmtFechaCorta(str) {
  if(!str) return '';
  const d = parseFecha(str);
  if(!d) return str;
  const dias = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  const meses = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  return dias[d.getDay()]+' '+d.getDate()+' '+meses[d.getMonth()];
}

// Get next scheduled match date for a torneo based on its dia and ini
function proximoPartido(tidOrTorneo) {
  const t = (typeof tidOrTorneo === 'object') 
    ? tidOrTorneo 
    : (window._cachedTorneos||[]).find(x=>x.id===tidOrTorneo);
  if(!t) return '';
  // If no dia configured, return ini date
  if(!t.dia) return t.ini || '';
  const diasSemana = {'lunes':1,'martes':2,'miércoles':3,'jueves':4,'viernes':5,'sábado':6,'domingo':0};
  const diaKey = (t.dia||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace('miercoles','miércoles').replace('sabado','sábado');
  // Try normalized, then original lowercased
  const normMap = {'lunes':1,'martes':2,'miercoles':3,'jueves':4,'viernes':5,'sabado':6,'domingo':0,
                   'miércoles':3,'sábado':6};
  // Support multiple days: "Miércoles y Sábados"
  const diaStr = (t.dia||'').toLowerCase();
  const targetDays = [];
  for(const [k,v] of Object.entries(normMap)) {
    if(diaStr.includes(k) && !targetDays.includes(v)) targetDays.push(v);
  }
  if(!targetDays.length) return t.ini || '';
  const today = new Date(); today.setHours(0,0,0,0);
  // Find the nearest upcoming match day
  let nearest = null, nearestDays = 999;
  for(const td of targetDays) {
    const d = new Date(today);
    let tries = 0;
    while(d.getDay() !== td && tries < 14) { d.setDate(d.getDate()+1); tries++; }
    const diff = Math.round((d - today) / 86400000);
    if(diff < nearestDays) { nearestDays = diff; nearest = d; }
  }
  if(!nearest) return t.ini || '';
  return nearest.getDate().toString().padStart(2,'0')+'/'+(nearest.getMonth()+1).toString().padStart(2,'0')+'/'+nearest.getFullYear();
}

  </div>
  <div id="plist">${js.map(row).join('')}</div>
  </div>`);
}
window.flPos=function(pos){
  window._PF=pos;
  ['ALL','ARQ','JUG'].forEach(f=>{
    const b=document.getElementById('pf-'+f);if(!b)return;
    const pc=PC[f]||'var(--gold)',s=f===pos;
    b.style.borderColor=s?(f==='ALL'?'var(--gold)':pc):'#2a2a3e';
    b.style.background=s?(f==='ALL'?'var(--gold)13':pc+'18'):'#0d0d1a';
    b.style.color=s?(f==='ALL'?'var(--gold)':pc):'var(--dim)';
  });
  flPls(document.getElementById('srch')?.value||'');
};
window.flPls=function(q){
  const f=(window._PLS||[]).filter(j=>(window._PF==='ALL'||j.pos===window._PF)&&(!q||j.nombre.toLowerCase().includes(q.toLowerCase())));
  const el=document.getElementById('plist');if(!el)return;
  const rm=window._RKM||{};
  el.innerHTML=f.map(j=>{
    const pc=PC[j.pos]||'var(--red)';
    const posLabel=j.pos==='ARQ'?'ARQ':'JUG';
    const rank=rm[j.id];
    const rating = Math.min(99, Math.max(50, Math.round(60 + (j.rating||0)*0.4 + (rank ? Math.max(0,10-rank)*2 : 0))));
    const av=j.foto
      ?`<img src="${j.foto}" style="width:100%;height:100%;object-fit:cover" alt=""/>`
      :`<span style="font-family:'Bebas Neue',sans-serif;font-size:24px;color:${pc}">${(j.nombre||'?')[0].toUpperCase()}</span>`;
    const convBadge=j.convocado
      ?`<div style="position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green)"></div>`:'';
    return`<div onclick="go('/player',{id:'${j.id}'})" class="fifa-card">
      ${convBadge}
      <div style="display:flex;align-items:center;gap:4px;margin-bottom:4px">
        <div style="font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--red);line-height:1;text-shadow:0 0 10px rgba(255,32,32,0.35)">${rating}</div>
        <div style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:9px;letter-spacing:1px;color:var(--dim)">${posLabel}</div>
      </div>
      <div class="fifa-card-photo">${av}</div>
      <div class="fifa-card-name">${j.nombre.split(' ')[0].toUpperCase()}</div>
      ${rank?`<div style="font-size:9px;color:var(--red);font-family:'Barlow Condensed',sans-serif;font-weight:900;margin-top:2px">#${rank}</div>`:''}
    </div>`;
  }).join('');
};

// Generate all match dates for a torneo between ini and fin
// t.dia can be 'Miércoles', 'Sábado', or 'Miércoles y Sábados' etc.
function fixtureFor(t, maxDates=30) {
  if(!t || !t.ini || !t.fin) return [];
  const diasSemana = {'lunes':1,'martes':2,'miércoles':3,'jueves':4,'viernes':5,'sábado':6,'domingo':0,
                      'miercoles':3,'sabado':6};
  // Parse target weekdays (support multiple: "Miércoles y Sábados")
  const diaStr = (t.dia||'').toLowerCase();
  const targetDays = [];
  for(const [k,v] of Object.entries(diasSemana)) {
    if(diaStr.includes(k)) { if(!targetDays.includes(v)) targetDays.push(v); }
  }
  if(!targetDays.length) return [];
  const ini = parseFecha(t.ini);
  const fin = parseFecha(t.fin);
  if(!ini || !fin) return [];
  const dates = [];
  const d = new Date(ini);
  while(d <= fin && dates.length < maxDates) {
    if(targetDays.includes(d.getDay())) {
      const dd = d.getDate().toString().padStart(2,'0');
      const mm = (d.getMonth()+1).toString().padStart(2,'0');
      const yy = d.getFullYear();
      dates.push(dd+'/'+mm+'/'+yy);
    }
    d.setDate(d.getDate()+1);
  }
  return dates;
}

window.votarFiguraHome = async function(pid, figJid) {
  if(!ME?.jid) return;
  try {
    const partidos = await getAll('partidos');
    const p = partidos.find(x=>x.id===pid);
    if(!p||!p.votacion_abierta){ alert('La votación ya cerró.'); sHome(); return; }
    const votos = p.votos_figura||[];
    if(votos.find(v=>(v.jid||v.voter)===ME.jid)){ alert('Ya votaste.'); return; }
    if(figJid===ME.jid){ alert('No podés votarte a vos mismo.'); return; }
    // Verify voter was in a team (use partido data directly)
    const jugV = [...new Set([...(p.equipo_a||[]),...(p.equipo_b||[])])];
    if(!jugV.includes(ME.jid)){ alert('Solo pueden votar los que jugaron el partido.'); return; }
    await upsertRow('partidos', {...p, votos_figura:[...votos,{jid:ME.jid,voto:figJid,ts:Date.now()}]});
    invalidateCache('partidos');
    sHome();
  } catch(e){ alert('Error: '+_errMsg(e)); }
};

window.votarFigura = async function(pid, figJid) {
  if(!ME?.jid) return;
  try {
    const partidos = await getAll('partidos');
    const p = partidos.find(x=>x.id===pid); if(!p||!p.votacion_abierta) return;
    // Check not already voted
    const votos = p.votos_figura||[];
    if(votos.find(v=>(v.jid||v.voter)===ME.jid)){ alert('Ya votaste en este partido.'); return; }
    // Check not voting self
    if(figJid===ME.jid){ alert('No podés votarte a vos mismo.'); return; }
    // Check voter was in this match
    if(!(p.conv||[]).includes(ME.jid)){ alert('Solo los que jugaron pueden votar.'); return; }
    const newVotos = [...votos, {voter:ME.jid, fig:figJid}];
    await upsertRow('partidos', {...p, votos_figura:newVotos});
    // Show confirmation
    await sProximos();
  } catch(e){ alert('Error: '+_errMsg(e)); }
};

window.toggleConvocado = async function(cvid, accion) {
  if(!ME?.jid) return;
  try {
    // Always fetch fresh from DB to avoid overwriting concurrent changes
    const fresh = await getOne('convocatorias', cvid);
    if(!fresh) return;
    const est = accion==='convocar' ? 'convocado' : 'no_convocado';
    const estado = JSON.parse(JSON.stringify(fresh.convocados_estado || []));
    const idx = estado.findIndex(x=>x.jid===ME.jid);
    if(idx>=0) {
      estado[idx].estado = est;
      if(est==='convocado') estado[idx].ts = estado[idx].ts || Date.now();
      if(est==='no_convocado') estado[idx].ts = null;
    } else {
      estado.push({jid:ME.jid, estado:est, ts: est==='convocado'?Date.now():null});
    }
    // Save only convocados_estado — atomic patch on the full row
    await upsertRow('convocatorias', {...fresh, convocados_estado: estado});
    await sProximos();
  } catch(e) {
    console.error('toggleConvocado error:', e);
    alert('No se pudo guardar. Intentá de nuevo.');
  }
};


async function sConvocatoria(p) {
  setContent(loading('Cargando...'));
  const [ts, allJs, convs, partidos] = await Promise.all([
    getAll('torneos').catch(()=>[]),
    getJugadores(false).catch(()=>[]),
    getAll('convocatorias').catch(()=>[]),
    getAll('partidos').catch(()=>[])
  ]);
  // Partidos pending figura vote or open voting
  const partidosSinFig = partidos.filter(p =>
    !p.fig &&
    (p.votacion_abierta || (p.votos_figura||[]).length > 0 ||
     (Array.isArray(p.conv) && p.conv.length > 0) ||
     (Array.isArray(p.equipo_a) && p.equipo_a.length > 0))
  );
  const t = ts.find(x=>x.id===(p.tid||'t1')) || ts[0];
  if(!t){ setContent('<div class="screen" style="padding:20px;color:var(--red)">No se encontró el torneo.</div>'); return; }

  const fecha = p.fecha || proximoPartido(t.id);
  // Try exact match first, then fallback to any future conv for this torneo
  let conv = convs.find(cv=>cv.tid===t.id && cv.fecha===fecha)
    || convs.filter(cv=>cv.tid===t.id && diasHasta(cv.fecha)>=0)
             .sort((a,b)=>diasHasta(a.fecha)-diasHasta(b.fecha))[0]
    || null;

  if(!conv) {
    // Double-check DB before auto-creating — cache might be stale
    try {
      const freshConvs = await _req('GET', '/convocatorias?tid=eq.'+t.id+'&fecha=eq.'+encodeURIComponent(fecha)+'&select=*');
      const freshRows = _plain(freshConvs)||[];
      if(freshRows.length > 0) {
        conv = freshRows[0];
        // Update cache
        invalidateCache('convocatorias');
      }
    } catch(e) {}
  }

  if(!conv) {
    // Auto-seed from last partido
    const fixture = fixtureFor(t);
    const fidx = fixture.indexOf(fecha);
    let autoConv = [];
    if(fidx>0) {
      const prevFechas = fixture.slice(0,fidx);
      const lastP = partidos.filter(p2=>p2.tid===t.id&&prevFechas.includes(p2.fecha)).sort((a,b)=>b.fecha.localeCompare(a.fecha))[0];
      if(lastP?.conv) autoConv = Array.isArray(lastP.conv)?lastP.conv:[];
    }
    conv = {
      id:uid(), tid:t.id, fecha, hora:t.id==='t2'?'15:00':'20:00',
      estado:'en_proceso',
      equipo_a:[], equipo_b:[],
      equipo_a_nombre:'AJAX', equipo_b_nombre:'ROMA',
      quieren_jugar:[],
      convocados_estado: [], // players self-convoke
      camisetero_ciclo_idx: 0,
      created_at: Date.now()
    };
    await upsertRow('convocatorias', conv);
  }

  // Migrate legacy estado values
  if(conv.estado==='borrador'||conv.estado==='abierto'||conv.estado==='confirmado'&&false) conv.estado='en_proceso';
  if(conv.estado==='confirmado') conv.estado='confirmado';
  if(!conv.convocados_estado) {
    const todos=[...new Set([...(conv.equipo_a||[]),...(conv.equipo_b||[])])];
    conv.convocados_estado=todos.map(jid=>({jid,estado:'convocado'}));
  }
  // (migration removed — toggleConvocado now always sets ts on self-convoke)
  if(!conv.equipo_a_nombre) conv.equipo_a_nombre='AJAX';
  if(!conv.equipo_b_nombre) conv.equipo_b_nombre='ROMA';

  CV = JSON.parse(JSON.stringify(conv));
  CV._js = allJs;
  CV._t = t;
  CV._ro = p.ro||false;

  // CV is already fresh from getAll() above — no extra fetch needed.
  // Concurrent player changes are handled by merge in saveConv.
  renderConv();
}

// ── Shared conv helpers ──────────────────────────────────────────────────────
async function saveConv() {
  // If admin: fetch latest from DB first, then apply our CV changes on top
  // so player self-convocations made concurrently are not overwritten
  let mergedEstado = CV.convocados_estado || [];
  if (ME && ME.admin) {
    try {
      const fresh = await getOne('convocatorias', CV.id);
      if (fresh && fresh.convocados_estado) {
        const dbEstado = fresh.convocados_estado;
        // Start from CV state (admin's intentional changes)
        mergedEstado = [...(CV.convocados_estado || [])];
        // Add any DB entries not in CV (player self-convocations)
        dbEstado.forEach(dbEntry => {
          const cvIdx = mergedEstado.findIndex(x => x.jid === dbEntry.jid);
          if (cvIdx < 0) {
            // Player exists in DB but not in CV — add them
            mergedEstado.push(dbEntry);
          }
          // If already in CV, keep CV version (admin's explicit change wins)
        });
      }
    } catch(e) { console.warn('saveConv merge error:', e.message); }
  }
  return upsertRow('convocatorias', {
    id: CV.id, tid: CV.tid, fecha: CV.fecha, hora: CV.hora,
    estado: CV.estado,
    equipo_a: CV.equipo_a, equipo_b: CV.equipo_b,
    equipo_a_nombre: CV.equipo_a_nombre, equipo_b_nombre: CV.equipo_b_nombre,
    quieren_jugar: CV.quieren_jugar,
    convocados_estado: mergedEstado,
    camisetero_ciclo_idx: CV.camisetero_ciclo_idx ?? null,
    created_at: CV.created_at || Date.now()
  });
}
function getEstado(jid) {
  const e = (CV.convocados_estado||[]).find(x=>x.jid===jid);
  return e ? e.estado : 'no_convocado';
}
function setEstado(jid, estado) {
  CV.convocados_estado = CV.convocados_estado || [];
  const idx = CV.convocados_estado.findIndex(x=>x.jid===jid);
  if(idx>=0) {
    CV.convocados_estado[idx].estado = estado;
    if(estado==='convocado' && !CV.convocados_estado[idx].ts) {
      CV.convocados_estado[idx].ts = Date.now();
    }
  } else {
    CV.convocados_estado.push({jid, estado, ts: estado==='convocado'?Date.now():null});
  }
  if(estado !== 'convocado') {
    CV.equipo_a = (CV.equipo_a||[]).filter(x=>x!==jid);
    CV.equipo_b = (CV.equipo_b||[]).filter(x=>x!==jid);
  }
}

  // ── ADMIN VIEW ───────────────────────────────────────────────────────

  const teamPickerHtml = !isConfirmado ? `

      <p class="lbl" style="margin-bottom:10px">CAMISETAS DEL PARTIDO</p>

  // ── JUGADORES LIST ────────────────────────────────────────────────────
  // Sort: in-team first (green), then convocado (blue), then no_convocado, then suspendido
  const ORDER = {convocado:0, no_convocado:1, suspendido:2};
  // convocados sorted by arrival time (ts), others alphabetically
  function getTs(jid){ const e=(CV.convocados_estado||[]).find(x=>x.jid===jid); return e?.ts||Infinity; }
  const allSorted = [...js].sort((a,b) => {
    const aInT = ea.includes(a.id)||eb.includes(a.id);
    const bInT = ea.includes(b.id)||eb.includes(b.id);
    if(aInT !== bInT) return aInT ? -1 : 1;
    const aEst = getEst(a.id), bEst = getEst(b.id);
    const od = (ORDER[aEst]??1) - (ORDER[bEst]??1);
    if(od !== 0) return od;
    // Within convocados: sort by arrival time
    if(aEst==='convocado' && bEst==='convocado') return getTs(a.id)-getTs(b.id);
    return a.nombre.localeCompare(b.nombre,'es');

  const totalConvocados = (CV.convocados_estado||[]).filter(x=>x.estado==='convocado').length;

      : inB
      ? `<span style="background:${teamB.color}30;border:1px solid ${teamB.color};color:${teamB.color};padding:1px 6px;border-radius:5px;font-size:9px;font-weight:800">${tb}</span>`

          <button onclick="adminSetEstado('${j.id}','suspendido')" style="padding:4px 9px;border-radius:6px;cursor:pointer;background:#ff444420;border:1px solid #ff4444;color:#ff4444;font-size:9px;font-weight:700">🚫</button>`;
      } else {

          controls = `
            ${ea.length<8 ? `<button onclick="asignarEquipo('${j.id}','a')" style="padding:4px 9px;border-radius:6px;cursor:pointer;background:${teamA.color}30;border:1px solid ${teamA.color};color:${teamA.color};font-size:9px;font-weight:700">${ta.slice(0,3)}</button>` : ''}
            ${eb.length<8 ? `<button onclick="asignarEquipo('${j.id}','b')" style="padding:4px 9px;border-radius:6px;cursor:pointer;background:${teamB.color}30;border:1px solid ${teamB.color};color:${teamB.color};font-size:9px;font-weight:700">${tb.slice(0,3)}</button>` : ''}`;
        }
      }

    const rowBg = inTeam
      ? 'linear-gradient(135deg,#001a10,#002a18)'
      : est==='convocado' ? 'linear-gradient(135deg,#001520,#002035)'
      : est==='suspendido' ? 'linear-gradient(135deg,#1a0000,#2a0000)'
      : 'var(--surf)';
    const rowBorder = inTeam ? '#00ff8830' : est==='convocado' ? '#00d4ff30' : est==='suspendido' ? '#ff444430' : '#1a1a2a';

    return `<div style="display:flex;align-items:center;gap:8px;padding:9px 10px;background:${rowBg};border:1px solid ${rowBorder};border-radius:9px;margin-bottom:5px">
      <div style="width:28px;height:28px;border-radius:50%;background:${pc}25;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:${pc};font-family:'Barlow Condensed',sans-serif;overflow:hidden;flex-shrink:0">${j.foto?`<img src="${j.foto}" style="width:100%;height:100%;object-fit:cover"/>`:j.nombre[0]}</div>
      <div style="flex:1;min-width:0">
        <div style="display:flex;align-items:center;gap:5px;flex-wrap:wrap">
          <p style="font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100px">${j.nombre}</p>
          ${teamTag}
        </div>
        <div style="display:flex;align-items:center;gap:5px;margin-top:2px">
          ${estadoBadge(est)}
          <span style="font-size:9px;color:${pc}">${posLabel}</span>
        </div>
      </div>
      <div style="display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:160px">${controls}</div>
    </div>`;
  }

  const jpe = t.jugadores_por_equipo || 8;
  console.log('[DEBUG] jpe=',jpe,'ea=',ea.length,'eb=',eb.length,'isConfirmado=',isConfirmado,'t=',t);
  const canConfirm = !isConfirmado && ea.length===jpe && eb.length===jpe;
  const convocarTodosBtn = !isConfirmado
    ? `<button onclick="convocarATodos()" style="width:100%;padding:11px;border-radius:9px;cursor:pointer;border:1px solid #00d4ff;background:#00d4ff15;color:#00d4ff;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:13px;letter-spacing:1px;margin-bottom:8px">✋ CONVOCAR A TODOS</button>`

  setContent(`<div class="screen up" style="padding:14px 15px 18px">
    ${fixBanner}

    ${teamsHtml}
    ${confirmBtn}
    <div style="margin-bottom:6px">
      <p class="lbl" style="margin-bottom:8px">JUGADORES · ${totalConvocados} convocados · ${ea.length+eb.length}/16 en equipos</p>
      ${allSorted.map(adminRow).join('')}
    </div>
    ${convocarTodosBtn}
  </div>`);
}


// ── Admin actions ────────────────────────────────────────────────────────────
window.convocarATodos = async function() {
  const js = CV._js || [];
  CV.convocados_estado = CV.convocados_estado || [];
  js.forEach(j => {
    const idx = CV.convocados_estado.findIndex(x=>x.jid===j.id);
    const est = idx>=0 ? CV.convocados_estado[idx].estado : 'no_convocado';
    // Don't change suspended players
    if(est === 'suspendido') return;
    if(idx>=0) CV.convocados_estado[idx].estado = 'convocado';
    else CV.convocados_estado.push({jid:j.id, estado:'convocado'});
  });
  await saveConv();
  renderConv();
};

window.adminSetEstado = async function(jid, estado) {
  setEstado(jid, estado);
  await saveConv();
  renderConv();
};
window.asignarEquipo = async function(jid, equipo) {
  const ea=CV.equipo_a||[], eb=CV.equipo_b||[];
  if(equipo==='a'&&ea.length>=8){alert('Equipo A ya tiene 8');return;}
  if(equipo==='b'&&eb.length>=8){alert('Equipo B ya tiene 8');return;}
  if(equipo==='a') CV.equipo_a=[...ea,jid]; else CV.equipo_b=[...eb,jid];
  await saveConv(); renderConv();
};
// ── Drag & drop swap ────────────────────────────────────────────────────────
var _dragJid = null, _dragFrom = null;

window.dragStart = function(ev, jid, equipo) {
  _dragJid = jid; _dragFrom = equipo;
  ev.dataTransfer.effectAllowed = 'move';
  ev.dataTransfer.setData('text/plain', jid);
  setTimeout(function(){ if(ev.target) ev.target.style.opacity='0.4'; }, 0);
  // Highlight drop zones
  ['a','b'].forEach(function(z){
    var el = document.getElementById('drop-zone-'+z);
    if(el && z !== equipo) {
      el.style.border = '2px dashed var(--gold)';
      el.style.background = 'var(--gold)08';
    }
  });
  // Also highlight headers
  document.querySelectorAll('[data-dropzone]').forEach(function(el){
    if(el.dataset.dropzone !== equipo) {
      el.style.border = '2px dashed var(--gold)60';
    }
  });
};

window.dragEnd = function(ev) {
  if(ev.target) ev.target.style.opacity = '1';
  ['a','b'].forEach(function(z){
    var el = document.getElementById('drop-zone-'+z);
    if(el){ el.style.border='2px dashed transparent'; el.style.background=''; }
  });
  document.querySelectorAll('[data-dropzone]').forEach(function(el){
    el.style.border = '2px dashed transparent';
    el.style.background = '';
  });
};

window.dragOver = function(ev) {
  ev.preventDefault();
  ev.dataTransfer.dropEffect = 'move';
  var zone = ev.currentTarget;
  if(zone && zone.dataset.dropzone !== _dragFrom) {
    zone.style.border = '2px dashed var(--gold)';
    zone.style.background = 'var(--gold)12';
  }
};

window.dragLeave = function(ev) {
  var zone = ev.currentTarget;
  if(zone) { zone.style.border='2px dashed transparent'; zone.style.background=''; }
};

window.dropOnTeam = async function(ev, targetEquipo) {
  ev.preventDefault();
  var zone = ev.currentTarget;
  if(zone){ zone.style.border='2px dashed transparent'; zone.style.background=''; }
  if(!_dragJid || _dragFrom === targetEquipo) return;
  var jid = _dragJid, fromEq = _dragFrom;
  _dragJid = null; _dragFrom = null;
  // Swap: move jid from fromEq to targetEquipo
  // If target team is full, swap with a player from target team? No — just move if space.
  // If target is full but source had the player: swap positions
  var ea = CV.equipo_a||[], eb = CV.equipo_b||[];
  var fromList = fromEq==='a' ? ea : eb;
  var toList   = fromEq==='a' ? eb : ea;
  if(!fromList.includes(jid)) return;
  var newFrom = fromList.filter(x=>x!==jid);
  var newTo   = [...toList, jid];
  if(fromEq==='a'){ CV.equipo_a=newFrom; CV.equipo_b=newTo; }
  else            { CV.equipo_b=newFrom; CV.equipo_a=newTo; }
  await saveConv();
  renderConv();
};

window.quitarDeEquipo = async function(jid) {
  CV.equipo_a=(CV.equipo_a||[]).filter(x=>x!==jid);
  CV.equipo_b=(CV.equipo_b||[]).filter(x=>x!==jid);
  await saveConv(); renderConv();
};
window.setTeam = async function(slot, nombre) {
  if(slot==='a'&&nombre===CV.equipo_b_nombre){alert('Ese equipo ya está en el otro lado.');return;}
  if(slot==='b'&&nombre===CV.equipo_a_nombre){alert('Ese equipo ya está en el otro lado.');return;}
  if(slot==='a') CV.equipo_a_nombre=nombre; else CV.equipo_b_nombre=nombre;
  await saveConv(); renderConv();
};

window.revertirPartido = async function() {
  if(CV.estado==='finalizado'){ alert('Este partido ya fue finalizado y no puede volver a convocatoria.'); return; }
  if(!confirm('¿Volver a "Convocatoria en proceso"? Los jugadores podrán modificar su estado nuevamente.')) return;
  CV.estado='en_proceso';
  await saveConv(); renderConv();
};
window.limpiarAutoSeed = async function() {
  if(!CV?.id) return;
  try {
    // Fetch absolute fresh from DB
    const fresh = await getOne('convocatorias', CV.id);
    if(!fresh) return;
    let changed = false;
    fresh.convocados_estado = (fresh.convocados_estado||[]).map(x=>{
      if(x.estado==='convocado' && !x.ts){ changed=true; return {...x, estado:'no_convocado'}; }
      return x;
    });
    if(changed) {
      await upsertRow('convocatorias', fresh);
      CV = JSON.parse(JSON.stringify(fresh));
      renderConv();
    }
  } catch(e){ alert('Error: '+_errMsg(e)); }
};
window.playerSetEstado = async function(nuevoEstado) {
  if(!ME?.jid || !CV?.id) return;
  try {
    const fresh = await getOne('convocatorias', CV.id);
    if(!fresh) return;
    const estado = JSON.parse(JSON.stringify(fresh.convocados_estado || []));
    const idx = estado.findIndex(x=>x.jid===ME.jid);
    if(idx>=0) {
      estado[idx].estado = nuevoEstado;
      if(nuevoEstado==='convocado') estado[idx].ts = estado[idx].ts || Date.now();
      if(nuevoEstado==='no_convocado') estado[idx].ts = null;
    } else {
      estado.push({jid:ME.jid, estado:nuevoEstado, ts: nuevoEstado==='convocado'?Date.now():null});
    }
    await upsertRow('convocatorias', {...fresh, convocados_estado: estado});
    CV = {...fresh, convocados_estado: estado};
    renderConv();
  } catch(e) { alert('Error: '+_errMsg(e)); }
};
window.playerPedirEntrar = async function() {
  if(!ME?.jid) return;
  setEstado(ME.jid,'convocado');
  await saveConv(); renderConv();
};
window.toggleAsistencia = async function(cvid, accion) {
  if(accion==='quiero') await window.playerPedirEntrar();
  else if(accion==='desconvocar') await window.playerSetEstado('no_convocado');
};

window.cpSQL = function() {
  var sql = window._sql || '';
  if (navigator.clipboard) {
    navigator.clipboard.writeText(sql).then(function() {
      var b = document.querySelector('[onclick="cpSQL()"]');
      if (b) { b.textContent = 'COPIADO!'; setTimeout(function(){ b.textContent = 'COPIAR SQL'; }, 2000); }
    }).catch(function(){ prompt('Copiá este SQL:', sql); });
  } else {
    prompt('Copiá este SQL:', sql);
  }
};

      <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">
        <span style="font-size:28px">${t.emoji||'⚽'}</span>
        <div style="flex:1">
          <div style="font-family:'Bebas Neue',sans-serif;font-size:18px;color:${color};letter-spacing:2px">${t.nombre}</div>
          <div style="font-size:11px;color:var(--dim);margin-top:2px">${t.deporte||'Fútbol'} ${t.jugadores_por_equipo?t.jugadores_por_equipo+'v'+t.jugadores_por_equipo:''} · ${t.dia||''} · ${t.ini||''} → ${t.fin||''}</div>
          <div style="font-size:10px;color:#3a3a5e;margin-top:2px">${t.formato==='liga'?'🏆 Liga':t.formato==='copa'?'🥊 Copa':t.formato==='grupos'?'🌍 Grupos':'🔄 Round robin'} · ${t.ranking_tipo==='equipo'?'👥 Por equipo':'👤 Individual'}</div>
        </div>
        <span style="font-size:10px;font-weight:900;color:${archived?'#5a5a7a':color};background:${archived?'#1a1a2e':''+color+'22'};padding:4px 8px;border-radius:6px;letter-spacing:1px">${archived ? tr('tour_finished_label') : tr('tour_active_label')}</span>
      </div>
      ${isActive ? `<div style="font-size:11px;color:${color};text-align:right">▶ TORNEO ACTUAL</div>` : ''}
      ${!archived ? `<div style="display:flex;gap:8px;margin-top:8px">
        <button onclick="event.stopPropagation();window.entrarTorneo('${t.id}')" style="flex:1;padding:10px;border-radius:9px;border:none;background:${color};color:#000;font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:14px;cursor:pointer">${tr('tour_enter')}</button>
        ${ME?.admin && t.ranking_tipo==='equipo' ? `<button onclick="event.stopPropagation();go('/equipos',{tid:'${t.id}'})" style="padding:10px 14px;border-radius:9px;border:2px solid ${color};background:transparent;color:${color};font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:13px;cursor:pointer">👥</button>` : ''}

      </div>` : ''}
      ${archived ? `<button onclick="event.stopPropagation();window.verHistorialTorneo('${t.id}')" style="width:100%;padding:10px;border-radius:9px;border:1px solid var(--bdr2);background:transparent;color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:13px;cursor:pointer;margin-top:8px">${tr('tour_view')}</button>` : ''}

    <p style="font-size:12px;color:var(--dim);margin-bottom:16px">Elegí el torneo para ver y participar</p>

    <div style="font-size:10px;font-weight:900;color:var(--red);letter-spacing:3px;margin-bottom:10px">${tr('tour_active')}</div>

window.entrarTorneo = function(tid) {
  const stored = JSON.parse(localStorage.getItem('emb_torneos')||'{}');
  stored[ME?.jid||'admin'] = tid;
  localStorage.setItem('emb_torneos', JSON.stringify(stored));
  // Update CURRENT_TORNEO
  getAll('torneos').then(ts => {
    CURRENT_TORNEO = ts.find(t=>t.id===tid) || null;
    go('/home');
  });
};

window.verHistorialTorneo = function(tid) {
  go('/ranking', {tid, historial:true});
};

// Restore last selected torneo on login
async function restoreTorneo() {
  const torneos = await getAll('torneos').catch(()=>[]);
  const stored = JSON.parse(localStorage.getItem('emb_torneos')||'{}');
  const lastId = stored[ME?.jid||'admin'];
  if(lastId) {
    CURRENT_TORNEO = torneos.find(t=>t.id===lastId) || null;
  }
  if(!CURRENT_TORNEO) {
    // Default to first active torneo
    CURRENT_TORNEO = torneos.find(t=>t.estado!=='archivado') || torneos[0] || null;
  }
}
