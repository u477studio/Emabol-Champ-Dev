window.selectSportConfig = function(scId) {
  document.getElementById('tf-sport-config-id').value = scId;
  // Update button styles
  document.querySelectorAll('[id^="sc-btn-"]').forEach(btn => {
    const isSelected = btn.id === 'sc-btn-' + scId;
    btn.style.border = '2px solid ' + (isSelected ? 'var(--gold)' : '#3a3a5e');
    btn.style.background = isSelected ? 'rgba(255,215,0,0.08)' : '#0d0d1a';
    btn.style.color = isSelected ? 'var(--gold)' : 'var(--muted)';
  });
  // Auto-set ranking tipo based on sport config
  getAll('sport_configs').then(scs => {
    const sc = scs.find(s=>s.id===scId);
    if(sc) window.setRankingTipo(sc.ranking_tipo || 'individual');
  }).catch(()=>{});
};

window.setRankingTipo = function(tipo) {
  document.getElementById('tf-ranking-tipo').value = tipo;
  ['individual','equipo'].forEach(t => {
    const btn = document.getElementById('btn-rk-' + t);
    if(!btn) return;
    const isSelected = t === tipo;
    btn.style.border = '2px solid ' + (isSelected ? 'var(--gold)' : '#3a3a5e');
    btn.style.background = isSelected ? 'rgba(255,215,0,0.08)' : 'transparent';
    btn.style.color = isSelected ? 'var(--gold)' : 'var(--muted)';
  });
};

window.guardarTorneo = async function(tid) {
  const nombre = document.getElementById('tf-nombre')?.value?.trim();
  if(!nombre){ alert('El nombre es obligatorio.'); return; }
  const scId = document.getElementById('tf-sport-config-id')?.value || 'sc1';
  // Get sport config data
  const scs = await getAll('sport_configs').catch(()=>[]);
  const sc = scs.find(s=>s.id===scId) || {deporte:'Fútbol', jugadores_por_equipo:5, icono:'⚽'};
  const row = {
    id: tid || uid(),
    nombre,
    deporte: sc.deporte,
    sport_config_id: scId,
    jugadores_por_equipo: sc.jugadores_por_equipo,
    formato: document.getElementById('tf-formato')?.value || 'liga',
    ranking_tipo: document.getElementById('tf-ranking-tipo')?.value || 'individual',
    dia: document.getElementById('tf-dia')?.value || 'Sábado',
    ini: document.getElementById('tf-ini')?.value || '',
    fin: document.getElementById('tf-fin')?.value || '',
    max_jugadores: parseInt(document.getElementById('tf-max')?.value||'16'),
    color: document.getElementById('tf-color')?.value || 'var(--gold)',
    emoji: document.getElementById('tf-emoji')?.value || sc.icono || '⚽',
    estado: 'activo'
  };
  try {
    await upsertRow('torneos', row);
    go('/torneos');
  } catch(e) { alert(tr('error') + _errMsg(e)); }
};

window.archivarTorneo = async function(tid) {
  if(!confirm(tr('confirm_archive'))) return;
  try {
    const torneos = await getAll('torneos');
    const torneo = torneos.find(t=>t.id===tid);
    if(torneo) await upsertRow('torneos', {...torneo, estado:'archivado'});
    if(CURRENT_TORNEO?.id === tid) CURRENT_TORNEO = null;
    go('/torneos');
  } catch(e) { alert(tr('error') + _errMsg(e)); }
};

window.toggleJugadorEquipo = function(jid, maxPP) {
  const input = document.getElementById('eq-jids');
  let jids = JSON.parse(input.value || '[]');
  const btn = document.getElementById('jbtn-'+jid);
  if(jids.includes(jid)) {
    jids = jids.filter(j=>j!==jid);
    btn.style.border = '2px solid #3a3a5e';
    btn.style.background = '#0d0d1a';
    btn.style.color = 'var(--muted)';
  } else {
    if(jids.length >= maxPP) { alert('Máximo '+maxPP+' jugadores por equipo.'); return; }
    jids.push(jid);
    btn.style.border = '2px solid var(--gold)';
    btn.style.background = 'rgba(255,215,0,0.08)';
    btn.style.color = 'var(--gold)';
  }
  input.value = JSON.stringify(jids);
};

window.guardarEquipo = async function(equipoId, tid) {
  const nombre = document.getElementById('eq-nombre')?.value?.trim();
  if(!nombre) { alert('El nombre es obligatorio.'); return; }
  const jids = JSON.parse(document.getElementById('eq-jids')?.value||'[]');

    tid,
    nombre,
    jugadores: jids,
    color: document.getElementById('eq-color')?.value || 'var(--gold)',

  };
  try {

  } catch(e) { alert(tr('error') + _errMsg(e)); }
};


// ═══════ HABILITAR CONVOCATORIAS ═══════
async function sHabilitarFechas(tid) {
  const [torneo, convs] = await Promise.all([
    getAll('torneos').then(ts=>ts.find(t=>t.id===tid)),
    getAll('convocatorias').catch(()=>[])
  ]);
  if(!torneo) { go('/home'); return; }

  // Get fixture dates for this torneo
  const allFechas = fixtureFor(torneo, 60);
  const today = new Date(); today.setHours(0,0,0,0);

  // Only show future dates that don't already have an active convocatoria
  const activeFechas = new Set(
    convs.filter(cv=>cv.tid===tid && cv.estado!=='finalizado').map(cv=>cv.fecha)
  );
  const futureFechas = allFechas.filter(f => {
    const d = parseFecha(f);
    return d && d >= today && !activeFechas.has(f);
  }).slice(0, 6); // show next 6 available

  if(!futureFechas.length) {
    setContent(`<div class="screen up" style="padding:76px 15px 90px">
      <button class="bk" onclick="go('/home')" style="margin-bottom:14px">${tr('back')}</button>
      <p style="color:var(--dim);text-align:center;padding:40px 0">No hay fechas disponibles para habilitar.</p>
    </div>${renderNav()}`);
    return;
  }

  const color = torneo.color || 'var(--gold)';

  setContent(`<div class="screen up" style="padding:76px 15px 90px">
    <button class="bk" onclick="go('/home')" style="margin-bottom:14px">${tr('back')}</button>
    <div style="margin-bottom:20px">
      <p style="font-size:10px;color:${color};font-weight:800;letter-spacing:3px">📅 HABILITAR FECHAS</p>
      <h2 style="font-family:'Barlow Condensed',sans-serif;font-size:22px">${torneo.nombre}</h2>
      <p style="font-size:12px;color:var(--dim);margin-top:4px">Elegí cuántas fechas habilitar para convocatoria</p>
    </div>

    <div style="display:flex;gap:10px;margin-bottom:20px">
      <button id="btn-1fecha" onclick="window.setFechasCount(1)" style="flex:1;padding:14px;border-radius:12px;border:2px solid ${color};background:${color}20;color:${color};font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:15px;cursor:pointer">
        1 FECHA
      </button>
      <button id="btn-2fechas" onclick="window.setFechasCount(2)" style="flex:1;padding:14px;border-radius:12px;border:2px solid var(--bdr2);background:transparent;color:var(--dim);font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:15px;cursor:pointer">
        2 FECHAS
      </button>
    </div>

    <div id="fechas-preview" style="margin-bottom:20px">
      ${futureFechas.slice(0,1).map((f,i) => `
        <div style="background:var(--card);border:2px solid ${color}40;border-radius:12px;padding:14px;margin-bottom:8px;display:flex;align-items:center;gap:12px">
          <div style="width:36px;height:36px;border-radius:50%;background:${color}20;border:2px solid ${color};display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:900;color:${color};font-size:14px">${i+1}</div>
          <div>
            <div style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:15px;color:var(--txt)">${fmtFechaCorta(f)}</div>
            <div style="font-size:11px;color:var(--dim)">${f}</div>
          </div>
        </div>
      `).join('')}
    </div>

    <button onclick="window.confirmarHabilitar('${tid}')" style="width:100%;padding:14px;border-radius:10px;border:none;background:linear-gradient(135deg,${color},${color}aa);color:#000;font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:15px;cursor:pointer">
      ✅ HABILITAR CONVOCATORIA
    </button>
  </div>${renderNav()}`);

  // Store state
  window._habilitar = { tid, torneo, futureFechas, count: 1, color };
}

window.setFechasCount = function(n) {
  if(!window._habilitar) return;
  window._habilitar.count = n;
  const { futureFechas, color } = window._habilitar;

  // Update button styles
  document.getElementById('btn-1fecha').style.border = `2px solid ${n===1?color:'#3a3a5e'}`;
  document.getElementById('btn-1fecha').style.background = n===1 ? color+'20' : 'transparent';
  document.getElementById('btn-1fecha').style.color = n===1 ? color : '#5a5a7a';
  document.getElementById('btn-2fechas').style.border = `2px solid ${n===2?color:'#3a3a5e'}`;
  document.getElementById('btn-2fechas').style.background = n===2 ? color+'20' : 'transparent';
  document.getElementById('btn-2fechas').style.color = n===2 ? color : '#5a5a7a';

  // Update preview
  const preview = document.getElementById('fechas-preview');
  if(preview) {
    preview.innerHTML = futureFechas.slice(0,n).map((f,i) => `
      <div style="background:var(--card);border:2px solid ${color}40;border-radius:12px;padding:14px;margin-bottom:8px;display:flex;align-items:center;gap:12px">
        <div style="width:36px;height:36px;border-radius:50%;background:${color}20;border:2px solid ${color};display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:900;color:${color};font-size:14px">${i+1}</div>
        <div>
          <div style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:15px;color:var(--txt)">${fmtFechaCorta(f)}</div>
          <div style="font-size:11px;color:var(--dim)">${f}</div>
        </div>
      </div>
    `).join('');
  }
};

window.confirmarHabilitar = async function(tid) {
  const { torneo, futureFechas, count } = window._habilitar || {};
  if(!torneo || !futureFechas) return;

  const fechasToCreate = futureFechas.slice(0, count);
  try {
    for(const fecha of fechasToCreate) {
      // Check if convocatoria already exists for this date
      const existing = await getAll('convocatorias')
        .then(cs => cs.find(c=>c.tid===tid && c.fecha===fecha))
        .catch(()=>null);
      if(!existing) {
        await upsertRow('convocatorias', {
          id: uid(), tid, fecha,
          hora: '20:00',
          estado: 'en_proceso',
          equipo_a: [], equipo_b: [],
          equipo_a_nombre: 'AJAX', equipo_b_nombre: 'ROMA',
          quieren_jugar: [], convocados_estado: [],
          camisetero_ciclo_idx: null,
          created_at: Date.now()
        });
      }
    }
    alert(`✅ ${fechasToCreate.length === 1 ? '1 fecha habilitada' : '2 fechas habilitadas'} correctamente.`);
    go('/home');
  } catch(e) {
    alert('Error: ' + _errMsg(e));
  }
};

// ═══════ SUPABASE AUTH ═══════
const _authUrl = () => _CFG.url.replace('/rest/v1','') + '/auth/v1';

async function authSignUp(email, password) {
  const res = await fetch(_authUrl() + '/signup', {
    method: 'POST',
    headers: {'Content-Type':'application/json', 'apikey': _CFG.key},
    body: JSON.stringify({email, password})
  });
  const data = await res.json();
  if(!res.ok) throw new Error(data.msg || data.error_description || 'Error al registrarse');
  return data;
}

async function authSignIn(email, password) {
  const res = await fetch(_authUrl() + '/token?grant_type=password', {
    method: 'POST',
    headers: {'Content-Type':'application/json', 'apikey': _CFG.key},
    body: JSON.stringify({email, password})
  });
  const data = await res.json();
  if(!res.ok) {
    const errMsg = data.message || data.msg || data.error_description || 'Email o contraseña incorrectos';
    if(errMsg.toLowerCase().includes('confirm') || errMsg.toLowerCase().includes('not confirmed')) {
      throw new Error('Debés confirmar tu email antes de ingresar. Revisá tu casilla de correo.');
    }
    throw new Error(errMsg);
  }
  return data; // { access_token, user }
}

async function authResetPassword(email) {
  const redirectTo = 'https://u477studio.github.io/Emabol-Champ/';
  const res = await fetch(_authUrl() + '/recover', {
    method: 'POST',
    headers: {'Content-Type':'application/json', 'apikey': _CFG.key},
    body: JSON.stringify({email, redirect_to: redirectTo})
  });
  if(!res.ok) {
    const data = await res.json();
    throw new Error(data.msg || 'Error al enviar email');
  }
}

async function authSignOut(token) {
  await fetch(_authUrl() + '/logout', {
    method: 'POST',
    headers: {'Content-Type':'application/json', 'apikey': _CFG.key, 'Authorization': 'Bearer ' + token}
  }).catch(()=>{});
}

// Find jugador linked to auth user
async function getJugadorByAuthId(authUserId) {
  // Always fetch fresh — never use cache for auth lookup
  invalidateCache('jugadores_full');

  const r = await _req('GET', '/jugadores?auth_user_id=eq.' + authUserId + '&select=*');

  return rows && rows.length ? rows[0] : null;
}

async function getJugadorByEmail(email) {
  const r = await _req('GET', '/jugadores?email=eq.' + encodeURIComponent(email) + '&select=*');
  const rows = _plain(r);
  return rows && rows.length ? rows[0] : null;
}

// ═══════ VOTING OVERLAY — shown when player hasn't voted yet ═══════
async function checkAndShowVoting() {
  if(!ME || ME.admin) return false;
  try {
    const [partidos, jugadores] = await Promise.all([
      getAll('partidos').catch(()=>[]),
      getJugadores(true).catch(()=>[])
    ]);
    const now = Date.now();
    // Find open votacion where player can vote and hasn't voted yet
    const pending = partidos.find(p => {
      if(!p.votacion_abierta) return false;
      if(p.votacion_cierre && now > p.votacion_cierre) return false;
      // Player must have played
      const jugaron = [...(p.equipo_a||[]), ...(p.equipo_b||[])];
      if(!jugaron.includes(ME.jid)) return false;
      // Player must not have voted yet
      const votos = p.votos_figura || [];
      if(votos.some(v=>(v.jid||v.voter)===ME.jid)) return false;
      return true;
    });
    if(!pending) return false;
    // Show voting overlay
    sVotingOverlay(pending, jugadores);
    return true;
  } catch(e) { return false; }
}

window.cerrarVotacion = async function(pid) {
  try {
    const partidos = await getAll('partidos');

    if(!p || !p.votacion_abierta) return;
    const votos = p.votos_figura||[];
    // Tally — support both formats
    const tally = {};
    votos.forEach(v=>{ const vt=v.voto||v.fig; if(vt) tally[vt]=(tally[vt]||0)+1; });
    const entries = Object.entries(tally).sort((a,b)=>b[1]-a[1]);
    const figura = entries.length ? entries[0][0] : null;
    await upsertRow('partidos', {
      ...p,
      fig: figura,
      votacion_abierta: false
    });
    invalidateCache('partidos');
    // Recalculate ranking after figura is assigned
    try { await window.recalcularRanking(p.tid); } catch(e) {}
  } catch(e) { console.error('cerrarVotacion error:', e); }
};

// ── Recalcular Ranking desde partidos ────────────────────────────────────────
window.recalcularRanking = async function(tid) {
  try {
    const [partidos, jugadores] = await Promise.all([
      getAll('partidos'),
      getJugadores(false)
    ]);
    const tPartidos = partidos.filter(p => !tid || p.tid === tid);
    if(!tPartidos.length) { alert('No hay partidos cargados para recalcular.'); return; }

    // Build stats per jugador per torneo
    const stats = {}; // key: jid+'_'+tid
    const key = (jid, t) => jid + '_' + t;

    tPartidos.forEach(p => {
      const eqA = p.equipo_a || [];
      const eqB = p.equipo_b || [];
      const todos = [...new Set([...eqA, ...eqB])];
      todos.forEach(jid => {
        const k = key(jid, p.tid);
        if(!stats[k]) stats[k] = {jid, tid:p.tid, g:0, c:0, f:0, pts:0};
        stats[k].c++;
        // Normalize gan field — support 'a','equipo_a','A' and 'b','equipo_b','B' and empate variants
        const ganNorm = (p.gan||'').toLowerCase().replace('equipo_','').trim();
        const gano = (ganNorm==='a' && eqA.includes(jid)) ||
                     (ganNorm==='b' && eqB.includes(jid));
        const empato = ganNorm==='empate' || ganNorm==='draw' || ganNorm==='e';
        // +1 participar
        stats[k].pts += 1;
        // +3 ganar
        if(gano)   { stats[k].g++; stats[k].pts += 3; }
        // +1 empatar
        else if(empato) { stats[k].pts += 1; }
        // +1 figura (regla correcta)
        if(p.fig === jid) { stats[k].f++; stats[k].pts += 1; }
      });
    });

    // Delete existing ranking rows for this torneo then reinsert
    const rows = Object.values(stats);
    invalidateCache('ranking');
    const existingRk = await getAll('ranking');
    const toDelete = existingRk.filter(r => !tid || r.tid === tid);
    for(const r of toDelete) {
      await _req('DELETE', '/ranking?id=eq.' + encodeURIComponent(r.id), null);
    }
    // Insert fresh rows
    for(const row of rows) {
      await upsertRow('ranking', {
        id: row.jid + '_' + row.tid,
        jid: row.jid,
        tid: row.tid,
        pts: row.pts,
        g:   row.g,
        c:   row.c,
        f:   row.f
      });
    }
    invalidateCache('ranking');
    alert('✅ Ranking recalculado correctamente (' + rows.length + ' registros).');
    go('/ranking');
  } catch(e) { alert('Error: ' + _errMsg(e)); }
};

// ═══════ sMatchJugador — player's match history ═══════
async function sMatch() {
  if(!ME?.admin){ go('/home'); return; }
  setContent(loading('Cargando partidos...'));
  const [ts, allJs, convs, partidos] = await Promise.all([
    getAll('torneos').catch(()=>[]),
    getJugadores(false).catch(()=>[]),
    getAll('convocatorias').catch(()=>[]),
    getAll('partidos').catch(()=>[])
  ]);
  const jMap = {};
  allJs.forEach(j=>jMap[j.id]=j);
  const now = Date.now();

  // Convocatorias confirmed but no result yet
  const convsPend = convs.filter(cv => {
    if(cv.estado !== 'confirmado') return false;
    return !partidos.some(p => p.tid===cv.tid && p.fecha===cv.fecha);
  }).sort((a,b)=>(parseFecha(b.fecha)||new Date(0))-(parseFecha(a.fecha)||new Date(0)));

  // Partidos with open voting or pending figura
  const sinFig = partidos.filter(p => !p.fig && (p.votacion_abierta || (p.votos_figura||[]).length > 0 || (p.equipo_a||[]).length > 0));

  function renderFigCard(p) {
    const t = ts.find(x=>x.id===p.tid)||{emoji:'⚽',nombre:''};
    const votos = p.votos_figura||[];
    const tally = {};
    votos.forEach(v=>{ const vt=v.voto||v.fig; if(vt) tally[vt]=(tally[vt]||0)+1; });
    const entries = Object.entries(tally).sort((a,b)=>b[1]-a[1]);
    const horasLeft = p.votacion_cierre ? Math.max(0,Math.round((p.votacion_cierre-now)/3600000)) : null;
    const rows = entries.length
      ? entries.map(([jid,cnt])=>{
          const nm = jMap[jid]?.nombre||jid;
          return '<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bdr)">'
            + '<span style="font-size:13px;color:var(--txt)">'+nm+'</span>'
            + '<span style="font-size:13px;font-weight:900;color:var(--red)">'+cnt+' voto'+(cnt!==1?'s':'')+'</span>'
            + '</div>';
        }).join('')
      : '<p style="font-size:12px;color:var(--dim)">Sin votos aún</p>';
    const label = p.votacion_abierta
      ? '🗳️ VOTACIÓN ABIERTA · '+votos.length+' voto'+(votos.length!==1?'s':'')+(horasLeft!==null?' · ⏱ '+horasLeft+'h':'')
      : '📊 '+votos.length+' votos registrados';
    return '<div style="background:var(--card);border:1px solid var(--bdr2);border-radius:12px;padding:14px;margin-bottom:12px">'
      + '<p style="font-size:11px;color:var(--red);font-weight:900;letter-spacing:2px;margin-bottom:4px">'+t.emoji+' '+fmtFecha(parseFecha(p.fecha))+'</p>'
      + '<p style="font-size:13px;color:var(--muted);margin-bottom:10px">'+label+'</p>'
      + rows
      + '<button onclick="cerrarVotacionAdmin(\''+p.id+'\')" style="width:100%;margin-top:10px;padding:12px;border-radius:8px;cursor:pointer;border:none;background:linear-gradient(135deg,#ffd700,#c9a800);color:#000;font-family:\'Barlow Condensed\',sans-serif;font-weight:900;font-size:14px;letter-spacing:2px">🏆 CERRAR VOTACIÓN Y ASIGNAR FIGURA</button>'
      + '</div>';
  }

  // Store all pending convs for lookup by id
  window._allPendCvs = convsPend;

  function renderPendCard(cv) {
    const t = ts.find(x=>x.id===cv.tid)||{emoji:'⚽',nombre:''};
    const tot = (cv.equipo_a||[]).length + (cv.equipo_b||[]).length;
    return '<div style="background:var(--card);border:1px solid var(--bdr2);border-radius:12px;padding:14px;margin-bottom:10px">'
      + '<p style="font-size:11px;color:var(--red);font-weight:900;letter-spacing:2px">'+t.emoji+' '+t.nombre+'</p>'
      + '<p style="font-family:\'Bebas Neue\',sans-serif;font-size:22px;letter-spacing:2px;color:var(--txt)">'+fmtFecha(parseFecha(cv.fecha))+'</p>'
      + '<p style="font-size:11px;color:var(--muted);margin-top:4px;margin-bottom:12px">'+tot+' jugadores convocados</p>'
      + '<button onclick="window.abrirResultadoForm(\''+cv.id+'\')" style="width:100%;padding:11px;border-radius:8px;border:none;background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;font-family:\'Barlow Condensed\',sans-serif;font-weight:900;font-size:14px;letter-spacing:2px;cursor:pointer">📊 CARGAR RESULTADO</button>'
      + '</div>';
  }

  const pendHtml = convsPend.length
    ? convsPend.map(renderPendCard).join('')
    : '<p style="font-size:13px;color:var(--dim);text-align:center;margin-bottom:16px">No hay partidos pendientes.</p>';

  const figHtml = sinFig.length
    ? '<p class="lbl" style="margin-top:4px;margin-bottom:10px">⭐ FIGURA DEL PARTIDO</p>' + sinFig.map(renderFigCard).join('')
    : '';

  setContent('<div class="screen up" style="padding:44px 15px 18px">'
    + '<button class="bk" onclick="go(\'/match\')">← VOLVER</button>'
    + '<h2 style="font-family:\'Bebas Neue\',sans-serif;font-size:28px;letter-spacing:3px;margin-bottom:16px">📊 CARGAR RESULTADO</h2>'
    + '<p class="lbl" style="margin-bottom:10px">PRÓXIMOS PARTIDOS</p>'
    + pendHtml
    + figHtml
    + '</div>');
}

      conv:allConv,
      votos_figura:[],
      votacion_abierta:true,
      votacion_cierre:cierre
    });
    invalidateCache('partidos');
    sendPushToLiga('votacion',
      '⭐ ¡Votación de figura abierta!',
      'Ya podés votar quién fue la figura del partido. Tenés 24hs.',
      '/'

async function sMatchJugador() {
  setContent(loading(tr('loading')));
  const [ts, partidos, convs, js] = await Promise.all([
    getAll('torneos').catch(()=>[]),
    getAll('partidos').catch(()=>[]),
    getAll('convocatorias').catch(()=>[]),
    getJugadores(true).catch(()=>[])
  ]);
  const jMap = {}; js.forEach(j=>jMap[j.id]=j);
  const torneo = CURRENT_TORNEO || ts.find(t=>t.estado!=='archivado');
  if(!torneo) { setContent('<p style="color:var(--dim);text-align:center;padding:40px">No hay torneo activo.</p>' + renderNav()); return; }
  const color = torneo.color || 'var(--gold)';

  // Get all partidos for this torneo sorted by date desc
  const tPartidos = partidos
    .filter(p=>p.tid===torneo.id)
    .sort((a,b)=>b.fecha.localeCompare(a.fecha));

  // Get upcoming convocatorias (no partido yet)
  const today = new Date(); today.setHours(0,0,0,0);
  const upcoming = convs
    .filter(cv=>{
      if(cv.tid!==torneo.id) return false;
      if(cv.estado==='finalizado') return false;
      const d = parseFecha(cv.fecha);
      return d && d >= today;
    })
    .sort((a,b)=>a.fecha.localeCompare(b.fecha))
    .filter(cv=>!tPartidos.some(p=>p.fecha===cv.fecha));

  const getPlayerResult = (p) => {
    const ea = p.equipo_a||[], eb = p.equipo_b||[];
    // Also support old conv format
    const conv = Array.isArray(p.conv) ? p.conv : [];
    const jugaron = [...new Set([...ea,...eb,...conv])];
    const jid = ME.jid;
    if(!jid || !jugaron.includes(jid)) return {code:'AUS', label:'AUSENTE', color:'var(--dim)'};
    const gan = p.gan;
    const isFig = p.fig === jid;
    if(!gan) return {code:'SIN', label:'SIN RESULT', color:'var(--dim)', fig:isFig};
    if(gan==='EMPATE' || gan==='empate' || gan===tr('draw')) return {code:'EMP', label:'EMPATE', color:'#aaaaaa', fig:isFig};
    const inA = ea.includes(jid) || (!ea.length && conv.includes(jid));
    const ganadorA = gan==='a';
    const gano = (inA && ganadorA) || (!inA && !ganadorA);
    if(gano) return {code:'GAN', label:'GANÓ', color:'#00ff88', fig:isFig};
    return {code:'DER', label:'DERROTA', color:'#ff4444', fig:isFig};
  };

  // Upcoming cards
  const upcomingCards = upcoming.map(cv=>{
    const d = parseFecha(cv.fecha);
    const dias = diasHasta(cv.fecha);
    const myEst = (cv.convocados_estado||[]).find(x=>x.jid===ME.jid)?.estado;
    const estBadge = cv.estado==='confirmado'
      ? `<span style="color:#00ff88;font-size:10px;font-weight:900">✓ CONFIRMADO</span>`
      : myEst==='convocado'
        ? `<span style="color:${color};font-size:10px;font-weight:900">✋ APUNTADO</span>`
        : `<span style="color:var(--dim);font-size:10px">Sin confirmar</span>`;
    return `<div style="background:var(--card);border:1px solid ${color}40;border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px">
      <div style="text-align:center;min-width:44px">
        <div style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:18px;color:${color}">${d?d.getDate():'-'}</div>
        <div style="font-size:9px;color:var(--dim);text-transform:uppercase">${d?['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'][d.getMonth()]:''}</div>
      </div>
      <div style="flex:1">
        <div style="font-size:12px;color:var(--muted)">${dias===0?'HOY':dias===1?'MAÑANA':'En '+dias+' días'}</div>
        <div style="font-size:11px;color:var(--dim)">${torneo.emoji} ${torneo.nombre}</div>
      </div>
      ${estBadge}
    </div>`;
  }).join('');

  // Build fixture list — all dates sorted ascending
  const fixture = fixtureFor ? fixtureFor(torneo) : [];
  const allFechas = fixture.length
    ? fixture
    : [...new Set([...tPartidos.map(p=>p.fecha), ...upcoming.map(cv=>cv.fecha)])].sort();

  // Played partido cards — fixture style
  const partidoCards = allFechas.map((fecha, i)=>{
    const p = tPartidos.find(x=>x.fecha===fecha);
    const cv = convs.find(x=>x.tid===torneo.id&&x.fecha===fecha);
    const d = parseFecha(fecha);
    const jNum = `J${i+1}`;
    const meses = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
    const dias = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
    const fechaStr = d ? `${dias[d.getDay()]} ${d.getDate()} ${meses[d.getMonth()]}` : fecha;
    const today2 = new Date(); today2.setHours(0,0,0,0);
    const isFuture = d && d > today2;
    const isToday = d && d.getTime()===today2.getTime();

    if(p) {
      // Played — show result
      const res = getPlayerResult(p);
      const isFig = p.fig === ME?.jid;
      const resultLabel = res.fig ? '⭐ FIGURA' : res.label;
      const resultColor = res.fig ? '#ffd700' : res.color;
      return `<div style="display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid rgba(255,255,255,0.04)">
        <div style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:11px;color:var(--dim);min-width:28px">${jNum}</div>
        <div style="flex:1;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;color:var(--white)">${fechaStr}</div>
        <div style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:12px;color:${resultColor};background:${resultColor}18;border:1px solid ${resultColor}40;padding:3px 10px;border-radius:6px;letter-spacing:1px">${resultLabel}</div>
      </div>`;
    } else if(!isFuture && !isToday) {
      // Past but no partido data — ausente
      return `<div style="display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid rgba(255,255,255,0.04)">
        <div style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:11px;color:var(--dim);min-width:28px">${jNum}</div>
        <div style="flex:1;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;color:var(--dim)">${fechaStr}</div>
        <div style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:12px;color:var(--dim);padding:3px 10px">—</div>
      </div>`;
    } else {
      // Future or today — show convocatoria status
      const myEst = cv ? (cv.convocados_estado||[]).find(x=>x.jid===ME?.jid)?.estado : null;
      const isConfirmado = cv?.estado==='confirmado';
      const statusColor = isConfirmado ? 'var(--green)' : myEst==='convocado' ? 'var(--red)' : 'var(--dim)';
      const statusLabel = isConfirmado ? 'CONFIRMADO' : myEst==='convocado' ? 'APUNTADO' : isToday?'HOY':'PRÓXIMO';
      const isActive = isToday || (d && Math.abs(diasHasta(fecha))<=2);
      return `<div style="display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid rgba(255,255,255,0.04)${isActive?';background:rgba(255,32,32,0.05)':''}">
        <div style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:11px;color:${isActive?'var(--red)':'var(--dim)'};min-width:28px">${jNum}</div>
        <div style="flex:1;font-family:'Barlow Condensed',sans-serif;font-weight:${isActive?'900':'700'};font-size:14px;color:${isActive?'var(--white)':'var(--muted)'}">${fechaStr}</div>
        <div style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:11px;color:${statusColor};letter-spacing:1px">${statusLabel}</div>
      </div>`;
    }
  }).join('');

  // Legacy fallback for tPartidos not in fixture
  const extraPartidos = tPartidos.filter(p=>!allFechas.includes(p.fecha));
  const extraCards = extraPartidos.map(p=>{
    const res = getPlayerResult(p);
    const d = parseFecha(p.fecha);
    const isFig = p.fig === ME?.jid;
    const resultLabel = isFig ? 'FIGURA ⭐' : res.label;
    const resultColor = isFig ? 'var(--gold)' : res.color;
    return `<div style="display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid rgba(255,255,255,0.04)">
      <div style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:11px;color:var(--dim);min-width:28px">—</div>
      <div style="flex:1;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;color:var(--white)">${d?['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'][d.getDay()]+' '+d.getDate()+' '+['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'][d.getMonth()]:p.fecha}</div>
      <div style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:12px;color:${resultColor};background:${resultColor}18;border:1px solid ${resultColor}40;padding:3px 10px;border-radius:6px">${resultLabel}</div>
    </div>`;
  }).join('');

  const xPlayed = tPartidos.length;
  const xTotal = allFechas.length;
  

  setContent(`<div class="screen up" style="padding:48px 16px 90px;background:transparent">
    <!-- Header -->
    <div style="margin-bottom:16px">
      <p style="font-size:10px;color:var(--red);font-weight:900;letter-spacing:4px;text-transform:uppercase">⚽ ${tr('matches')}</p>
      <h2 style="font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:2px">${torneo.nombre}</h2>
    </div>
    <!-- Upcoming convocatoria card (if any) -->
    ${upcomingCards}
    <!-- Fixture with results -->
    <div style="background:var(--card);border:1px solid var(--bdr2);border-radius:14px;overflow:hidden;margin-top:12px">
      <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--bdr2)">
        <p style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:11px;letter-spacing:3px;color:var(--red)">📋 FIXTURE</p>
        <p style="font-size:11px;color:var(--dim)">${xPlayed}/${xTotal} jugados</p>
      </div>
      ${partidoCards}${extraCards}
    </div>
  </div>${renderNav()}`);
}

const VAPID_PUBLIC_KEY = 'BOXii6AcIZREOjmPyYqvttTn_qs7nj_iIPIT9PZO9gaWtqcgDOKKsz8r8gL83OljKSgufiN7VOeVsmGPGmgNyjQ';

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  return new Uint8Array([...rawData].map(c => c.charCodeAt(0)));
}

async function registerPush() {
  if(!('serviceWorker' in navigator) || !('PushManager' in window)) return false;
  try {
    const reg = await navigator.serviceWorker.ready;
    const existing = await reg.pushManager.getSubscription();
    if(existing) { await savePushSub(existing); return true; }

    const perm = await Notification.requestPermission();
    if(perm !== 'granted') return false;

    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
    });
    await savePushSub(sub);
    return true;
  } catch(e) { console.warn('Push registration failed:', e); return false; }
}

async function savePushSub(sub) {
  const key = sub.getKey('p256dh');
  const auth = sub.getKey('auth');
  const p256dh = btoa(String.fromCharCode(...new Uint8Array(key)));
  const authStr = btoa(String.fromCharCode(...new Uint8Array(auth)));
  await _req('POST', '/push_subscriptions', {
    id: btoa(sub.endpoint).slice(0,36).replace(/[^a-zA-Z0-9]/g,'').slice(0,36),
    liga_id: getLigaId(),
    jid: ME?.jid || null,
    endpoint: sub.endpoint,
    p256dh, auth: authStr,
    user_agent: navigator.userAgent.slice(0,200),
    activo: true
  }).catch(()=>{});
}

async function sendPushToLiga(evento, titulo, cuerpo, url='/') {
  // Call Supabase Edge Function
  const cfg = _CFG || {};
  if(!cfg.url) return;
  try {
    await fetch(cfg.url + '/functions/v1/send-push', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + (cfg.key||'')
      },
      body: JSON.stringify({ liga_id: getLigaId(), evento, titulo, cuerpo, url })
    });
  } catch(e) { console.warn('sendPush error:', e); }
}

// Auto-register push after login
async function initPush() {
  if(!ME || !('Notification' in window)) return;
  // Only ask if not already granted/denied
  if(Notification.permission === 'default') {
    // Delay to avoid asking immediately on login
    setTimeout(registerPush, 3000);
  } else if(Notification.permission === 'granted') {
    await registerPush();
  }
}

window.confirmarResetPassword = async function() {
  const pass1 = document.getElementById("rp-pass1")?.value?.trim();
  const pass2 = document.getElementById("rp-pass2")?.value?.trim();
  const errEl = document.getElementById("rp-err");
  if(!pass1||pass1.length<6){ errEl.textContent="Mínimo 6 caracteres"; errEl.style.display="block"; return; }
  if(pass1!==pass2){ errEl.textContent="Las contraseñas no coinciden"; errEl.style.display="block"; return; }
  errEl.style.display="none";
  try {
    const cfg = _CFG||{};
    const resp = await fetch(cfg.url+"/auth/v1/user",{
      method:"PUT",
      headers:{"Content-Type":"application/json","apikey":cfg.key,"Authorization":"Bearer "+window._resetToken},
      body:JSON.stringify({password:pass1})
    });
    if(!resp.ok){ const e=await resp.json().catch(()=>({})); throw new Error(e.message||"Error"); }
    window._resetToken = null;
    setContent("<div class=\"screen up\" style=\"padding:44px 24px;text-align:center\">"
      + "<div style=\"font-size:56px;margin-bottom:16px\">&#9989;</div>"
      + "<h2 style=\"font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:3px;color:var(--green);margin-bottom:8px\">LISTO!</h2>"
      + "<p style=\"color:var(--muted);font-size:14px;margin-bottom:32px\">Contraseña actualizada correctamente.</p>"
      + "<button onclick=\"go('/login')\" class=\"btn btn-gold\" style=\"max-width:220px\">INGRESAR</button>"
      + "</div>");
  } catch(e) {
    const errEl2=document.getElementById("rp-err");
    if(errEl2){ errEl2.textContent="Error: "+_errMsg(e); errEl2.style.display="block"; }
    else { alert("Error: "+_errMsg(e)); }
  }
};

var _pwaPrompt = null;

});
window.addEventListener('appinstalled', function(){
  _pwaInstalled = true;
  _pwaPrompt = null;
  var b = document.getElementById('pwa-btn');
  if(b) b.remove();
});

window.doInstallPWA = async function(){
  if(_pwaPrompt){
    _pwaPrompt.prompt();
    await _pwaPrompt.userChoice;
    _pwaPrompt = null;
    var b = document.getElementById('pwa-btn'); if(b) b.remove();
  } else {
    var b = document.getElementById('pwa-btn');
    if(b) b.innerHTML = '<div style="background:var(--surf);border:2px solid var(--red);border-radius:14px;padding:14px 16px;box-shadow:0 4px 24px #000000c0;max-width:300px">'

      +'</div>';

};

window.dismissPWA = function(){

};
